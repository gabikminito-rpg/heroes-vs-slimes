function update(dt){
  if(TBM.on&&(mode==='tb'||mode==='win'||mode==='lose')){tbUpdate(dt);return;}
  onResult();
  time+=dt;modeT+=dt;
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
  for(const e of efx){e.t+=dt;if(e.u)e.u(dt);}
  efx=efx.filter(e=>!e.dead);
  shake=Math.max(0,shake-dt*20);
  hero.flash=Math.max(0,hero.flash-dt);
  if(mode==='battle'||mode==='ult'||mode==='tornado'||mode==='pdash')hero.sk=Math.max(0,hero.sk-dt);
  for(const s of slimes){s.flash=Math.max(0,s.flash-dt);s.kb*=Math.pow(.001,dt);s.cut=Math.max(0,(s.cut||0)-dt);}
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?0:520)*dt;});
  parts=parts.filter(p=>p.life>0);
  fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.8);
  floats.forEach(f=>{f.life-=dt;f.y-=40*dt;});
  floats=floats.filter(f=>f.life>0);

  if(mode==='intro'){
    hero.t+=dt;
    if(hero.x<HX){hero.x=Math.min(HX,hero.x+125*dt);if(hero.x>=HX){hero.anim='idle';hero.t=0;}}
    updateSlimes(dt);
    const f=alive()[0];
    if(hero.x>=HX&&f&&Math.abs(f.x-(hero.x+175))<5){introDone+=dt;if(introDone>.8){mode='battle';modeT=0;}}
  }else if(mode==='battle'){
    hero.t+=dt;
    if(hero.anim==='cast'){
      const c=hero.cast,cl=M[c.clip],fr=Math.floor(hero.t*cl.fps);
      if(c.mv)hero.x=HX+c.mv(hero.t,c);
      if(!c.done&&fr>=c.hit){c.done=true;c.fn();}
      if(fr>=(c.seq?c.seq.length:cl.n)){hero.anim='idle';hero.t=0;hero.cast=null;if(c.mv)hero.x=HX;}
    }
    updateSlimes(dt);
    if(alive().length===0&&slimes.every(s=>s.st!=='dying')){mode='win';modeT=0;endT=0;}
  }else if(mode==='ult'){
    const TA=.55,TD=.2;
    ult.t+=dt;
    if(ult.t<TA){
      ult.frame=Math.min(4,Math.floor(ult.t/TA*5));ult.dark=ease(ult.t/TA)*.62;hero.x=ult.from;
    }else if(ult.t<TA+TD){
      const p=(ult.t-TA)/TD;hero.x=lerp(ult.from,ult.to,ease(p));
      ult.frame=p<.5?5:6;ult.dark=.62;ult.streak=1;
      for(const s of alive()){if(hero.x>=s.x&&!s.cm){s.cm=true;s.cut=.7;}}
    }else{
      const u=ult.t-TA-TD;hero.x=ult.to;
      if(!ult.hit){ult.hit=true;shake=14;alive().forEach(s=>{s.cut=.5;hurtSlime(s,60,true);});}
      ult.frame=Math.min(M.ult.n-1,6+Math.floor(u*M.ult.fps));
      ult.dark=.62*(1-clamp(u/.5,0,1));ult.streak=1-clamp(u/.35,0,1);
      if(ult.frame>=M.ult.n-1&&u>(M.ult.n-6)/M.ult.fps){
        hero.anim='idle';hero.t=0;ult=null;
        const left=alive();
        if(left.length){mode='battle';modeT=0;hero.x=HX;}
        else{mode='win';modeT=0;endT=0;}
      }
    }
    updateDying(dt);
  }else if(mode==='tornado'){
    const cl=M.tornado;
    tor.t+=dt;hero.t=tor.t;
    const idx=Math.min(Math.floor(tor.t*cl.fps),cl.n-1);
    hero.x=idx<27?lerp(tor.from,CX,ease(idx/27)):CX;
    while(tor.k<TICKS.length&&idx>=TICKS[tor.k]){tor.k++;shake=7;alive().forEach(s=>hurtSlime(s,5));}
    const f=clamp((idx-26)/10,0,1),fe=ease(f);
    for(const s of slimes){
      if(s.st==='alive'){
        s.x=lerp(s.x0,CX+s.off,fe);
        s.lift=fe*(55+22*Math.sin(time*9+s.ph));
        s.rot=fe*.55*Math.sin(time*8+s.ph);
        s.moving=false;
      }
    }
    updateDying(dt);
    if(tor.t>=cl.n/cl.fps){
      hero.anim='idle';hero.t=0;tor=null;gain(25);
      const left=alive();
      if(left.length){mode='battle';modeT=0;hero.x=HX;left.forEach(s=>{s.lift=0;s.rot=0;});}
      else{mode='win';modeT=0;endT=0;}
    }
  }else if(mode==='pdash'){
    pd.t+=dt;hero.t+=dt;const T=pd.t;
    if(T<.30){hero.x=pd.from;}
    else if(T<.60){const p=(T-.30)/.30;hero.x=lerp(pd.from,pd.to,ease(p));for(const s of alive())if(!pd.h1.has(s)&&hero.x>=s.x-70){pd.h1.add(s);hurtSlime(s,8);s.kb=20;shake=4;}}
    else if(T<1.05){hero.x=pd.to;for(const s of alive())if(!pd.h1.has(s)){pd.h1.add(s);hurtSlime(s,8);s.kb=20;}if(!pd.sl){pd.sl=1;shake=8;}}
    else if(T<1.35){const p=(T-1.05)/.30;hero.x=lerp(pd.to,pd.from,ease(p));for(const s of alive())if(!pd.h2.has(s)&&hero.x<=s.x+40){pd.h2.add(s);hurtSlime(s,7);s.kb=20;shake=4;}}
    else{hero.x=pd.from;}
    updateDying(dt);
    if(T>=1.35+.60){hero.anim='idle';hero.t=0;pd=null;mode='battle';modeT=0;gain(10);}
  }else if(mode==='win'||mode==='lose'){
    hero.t+=dt;endT+=dt;updateDying(dt);
  }
}
function updateDying(dt){for(const s of slimes)if(s.st==='dying'){s.dt+=dt;if(s.dt>.4)s.st='dead';}}
function updateSlimes(dt){
  const al=alive();let acc=0;
  al.forEach((s,r)=>{
    if(r>0)acc+=(al[r-1].gap+s.gap)/2;
    if(s.regen&&s.hp<s.max)s.hp=Math.min(s.max,s.hp+s.regen*dt);
    if(s.stun>0){s.stun-=dt;s.moving=false;return;}
    const tx=hero.x+175+acc;
    const d=tx-s.x,step=Math.min(Math.abs(d),(mode==='intro'?110:70)*(s.spd||1)*dt);
    s.x+=Math.sign(d)*step;s.moving=step>.01;
    if(mode==='battle'&&r===0&&Math.abs(d)<6&&hero.hp>0){
      if(s.lunge<=0){s.cd-=dt;if(s.cd<=0){s.lunge=.5;s.lh=false;s.cd=(2.3+Math.random())*(s.cdm||1);}}
    }
    if(s.lunge>0){
      s.lunge-=dt;const p=1-s.lunge/.5;
      if(!s.lh&&p>=.5){s.lh=true;hurtHero(Math.round((TANKS.includes(sel)?5:8)*(s.dmg||1)));}
    }
  });
  updateDying(dt);
}

function heart(x,y,r){

  ctx.bezierCurveTo(x+r*.8,y-r*1.3,x+r*1.6,y-r*.2,x,y+r*.9);ctx.closePath();
}

  else if(hero.anim==='pdash'&&pd){const f=pdFrame();if(f.flip){ctx.save();ctx.translate(hero.x,0);ctx.scale(-1,1);drawClip('skill',f.i,0,HY,alpha);ctx.restore();}else drawClip('skill',f.i,hero.x,HY,alpha);}
  else if(hero.anim==='tornado'&&tor)drawClip('tornado',Math.min(Math.floor(tor.t*M.tornado.fps),M.tornado.n-1),hero.x,HY,alpha);
  else if(hero.anim==='ult'&&ult){
    if(ult.t>.55&&ult.t<.75){const p=(ult.t-.55)/.2;for(let k=5;k>=1;k--){drawClip('ult',5,lerp(ult.from,ult.to,ease(Math.max(0,p-k*.07))),HY,.28);}}

  }
  else{const ic=M.breath?'breath':'idle';{const cc=M[ic];let fi=Math.floor(hero.t*cc.fps);if(cc.pp&&cc.n>1){fi%=2*cc.n-2;if(fi>=cc.n)fi=2*cc.n-2-fi;}else fi%=cc.n;drawClip(ic,fi,hero.x,HY,alpha);}}
}

function tbSpawn(){

  const tot=L.reduce((a,e,i)=>i?a+(L[i-1].gap+e.gap)/2:a,0);let x=770-tot/2;
  L.forEach((e,i)=>{if(i>0)x+=(L[i-1].gap+e.gap)/2;e.tx=x;e.x=x+340;e.y=SY-4+(i%2)*16;e.moving=true;e.kb=0;e.lunge=0;e.stun=0;});

function tbOrder(){
  const H=tbHs(),E=tbEn(),o=[],n=Math.max(H.length,E.length);
  for(let i=0;i<n;i++){if(H[i])o.push(H[i]);if(E[i])o.push(E[i]);}

function tbAct(h,kind){

  if(!MM[clip]||!MM[clip].n)clip='attack';
  const c=MM[clip],seq=kind==='u'&&sp.u.seq?sp.u.seq:null,n=seq?seq.length:c.n,dur=n/c.fps;
  const hf=part.h!=null?part.h:Math.floor(n*.5);
  return {side:'h',u:h,kind,clip,seq,hit:Math.min(dur*.9,hf/c.fps),dur:dur+.15,t:0,done:false,K:DMG_K[rarOf(h.id)],sp};
}
function hurtE(s,n,big){

  if(s.red)n=Math.max(1,Math.round(n*(1-s.red)));

}
function healU(h,n){const g=Math.min(n,h.max-h.hp);h.hp+=g;addFloat(h.x,h.y-195,'+'+g,'#7dff9a',30);burst(h.x,h.y-90,'#7dff9a',8);}
function hurtU(h,n){

function tbApply(a){
  const h=a.u,sp=a.sp,K=a.K,al=tbEn(),stn=v=>Math.max(1,Math.ceil(v/3));
  if(a.kind==='a'){
    sp.a.d.forEach((d,i)=>{if(al[i])hurtE(al[i],Math.round(d*K),false);});
    h.en=Math.min(100,h.en+24);shake=4;
  }else if(a.kind==='s'){
    const S=sp.s;
    if(S.t==='heal'){const t=tbHs().sort((p,q)=>p.hp/p.max-q.hp/q.max)[0];healU(t,Math.round(S.d*K));h.en=Math.min(100,h.en+15);}
    else{(S.t==='two'?al.slice(0,2):al).forEach(t=>{hurtE(t,Math.round(S.d*K),false);if(S.stun)t.stun=Math.max(t.stun||0,stn(S.stun));});h.en=Math.min(100,h.en+12);shake=8;}
  }else{
    const U=sp.u;
    al.forEach(t=>{hurtE(t,Math.round(U.d*K),true);if(U.stun)t.stun=Math.max(t.stun||0,stn(U.stun));});

}
function tbStart(a){

  if(a.kind==='u')a.u.en=0;
}
function tbStep(){
  while(TBM.ultQ.length){const h=TBM.ultQ.shift();if(h.hp>0&&h.en>=100&&tbEn().length){tbStart(tbAct(h,'u'));return;}}
  if(!tbHs().length){mode='lose';modeT=0;endT=0;return;}
  if(!tbEn().length){
    if(TBM.wave+1<TBM.waves){TBM.wave++;tbSpawn();TBM.order=[];TBM.gap=1.0;return;}
    mode='win';modeT=0;endT=0;return;
  }
  if(TBM.oi>=TBM.order.length)tbOrder();
  const u=TBM.order[TBM.oi++];
  if(!u)return;
  if(u.id!==undefined){
    if(u.hp<=0)return;
    const sp=spec(u.id);if(u.sk>0)u.sk--;
    const need=sp.s.t!=='heal'||tbHs().some(x=>x.hp/x.max<.75);
    if(u.sk===0&&need){u.sk=Math.max(2,Math.round(sp.s.cd/2.5));tbStart(tbAct(u,'s'));}
    else tbStart(tbAct(u,'a'));
  }else{
    if(u.st!=='alive')return;
    if(u.regen&&u.hp<u.max){u.hp=Math.min(u.max,u.hp+Math.round(u.regen*2.5));}
    if(u.stun>0){u.stun--;addFloat(u.x,u.y-100,'ZZZ','#cfd6e4',26);TBM.gap=.3;return;}
    const hs=tbHs(),t=hs[Math.floor(Math.random()*hs.length)];
    TBM.act={side:'e',u,tgt:t,t:0,hit:.32,dur:.72,done:false,dist:Math.abs(u.x-(t.x+92))};
  }
}
function tbUpdate(dt){
  onResult();
  time+=dt;modeT+=dt;
  shake=Math.max(0,shake-dt*20);
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?0:520)*dt;});parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>{f.life-=dt;f.y-=40*dt;});floats=floats.filter(f=>f.life>0);
  for(const h of TBM.hs){h.flash=Math.max(0,h.flash-dt);h.t+=dt;}
  for(const e of TBM.all){
    e.flash=Math.max(0,e.flash-dt);
    if(e.st==='dying'){e.dt+=dt;if(e.dt>.4)e.st='dead';}
    if(e.st==='alive'&&e.wv===TBM.wave&&e.tx!=null&&!(TBM.act&&TBM.act.u===e)){
      const d=e.tx-e.x;
      if(Math.abs(d)>1){e.x+=Math.sign(d)*Math.min(Math.abs(d),240*dt);e.moving=true;}else e.moving=false;
      e.kb*=Math.pow(.001,dt);
    }

  if(mode==='win'||mode==='lose'){endT+=dt;return;}
  if(TBM.intro>0){TBM.intro-=dt;return;}

    const a=TBM.act;a.t+=dt;
    if(a.side==='h'){
      if(!a.done&&a.t>=a.hit){a.done=true;tbApply(a);}
      if(a.t>=a.dur){TBM.act=null;TBM.gap=.28;}
    }else{
      const e=a.u,p=a.t/a.dur;
      let f=a.t<.34?ease(clamp(a.t/.34,0,1)):1-ease(clamp((a.t-.4)/.32,0,1));
      e.kb=-a.dist*f;e.lunge=0;
      if(!a.done&&a.t>=a.hit){a.done=true;const base=TANKS.includes(a.tgt.id)?EDM*.7:EDM;hurtU(a.tgt,Math.round(base*(e.dmg||1)));if(e.cdm<=.65){const t2=a.tgt;later(.18,()=>{if(t2.hp>0)hurtU(t2,Math.round(base*(e.dmg||1)*.5));});}}
      if(a.t>=a.dur){e.kb=0;TBM.act=null;TBM.gap=.28;}
    }
    for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const fn=timers[i].fn;timers.splice(i,1);fn();}}
    return;
  }
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const fn=timers[i].fn;timers.splice(i,1);fn();}}
  TBM.gap-=dt;
  if(TBM.gap<=0)tbStep();
}

  }

  if(mode==='loading')return;
