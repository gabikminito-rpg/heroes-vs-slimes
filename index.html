function pdFrame(){const T=pd.t;
  if(T<.30)return {i:Math.min(2,Math.floor(T/.30*3))};
  if(T<.60)return {i:4+Math.floor(T*18)%6};
  if(T<1.05)return {i:Math.min(22,18+Math.floor((T-.60)*11))};
  if(T<1.35)return {i:4+Math.floor(T*18)%6,flip:true};
  return {i:Math.min(32,24+Math.floor((T-1.35)*14))};}

/* ---------- actualización ---------- */
function update(dt){
  time+=dt;modeT+=dt;
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
  for(const e of efx){e.t+=dt;if(e.u)e.u(dt);}
  efx=efx.filter(e=>!e.dead);
  shake=Math.max(0,shake-dt*20);
  hero.flash=Math.max(0,hero.flash-dt);
  if(mode==='battle'||mode==='ult'||mode==='tornado'||mode==='pdash')hero.sk=Math.max(0,hero.sk-dt);
  for(const s of slimes){s.flash=Math.max(0,s.flash-dt);s.kb*=Math.pow(.001,dt);s.cut=Math.max(0,(s.cut||0)-dt);}
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?0:520)*dt;});
  parts=parts.filter(p=>p.life>0);
  fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.8);
  floats.forEach(f=>{f.life-=dt;f.y-=40*dt;});
  floats=floats.filter(f=>f.life>0);

  if(mode==='intro'){
    hero.t+=dt;
    if(hero.x<HX){hero.x=Math.min(HX,hero.x+125*dt);if(hero.x>=HX){hero.anim='idle';hero.t=0;}}
    updateSlimes(dt);
    const f=alive()[0];
    if(hero.x>=HX&&f&&Math.abs(f.x-(hero.x+175))<5){introDone+=dt;if(introDone>.8){mode='battle';modeT=0;}}
  }else if(mode==='battle'){
    hero.t+=dt;
    if(hero.anim==='cast'){
      const c=hero.cast,cl=M[c.clip],fr=Math.floor(hero.t*cl.fps);
      if(c.mv)hero.x=HX+c.mv(hero.t,c);
      if(!c.done&&fr>=c.hit){c.done=true;c.fn();}
      if(fr>=(c.seq?c.seq.length:cl.n)){hero.anim='idle';hero.t=0;hero.cast=null;if(c.mv)hero.x=HX;}
    }
    updateSlimes(dt);
    if(alive().length===0&&slimes.every(s=>s.st!=='dying')){mode='win';modeT=0;endT=0;}
  }else if(mode==='ult'){
    const TA=.55,TD=.2;
    ult.t+=dt;
    if(ult.t<TA){
      ult.frame=Math.min(4,Math.floor(ult.t/TA*5));ult.dark=ease(ult.t/TA)*.62;hero.x=ult.from;
    }else if(ult.t<TA+TD){
      const p=(ult.t-TA)/TD;hero.x=lerp(ult.from,ult.to,ease(p));
      ult.frame=p<.5?5:6;ult.dark=.62;ult.streak=1;
      for(const s of alive()){if(hero.x>=s.x&&!s.cm){s.cm=true;s.cut=.7;}}
    }else{
      const u=ult.t-TA-TD;hero.x=ult.to;
      if(!ult.hit){ult.hit=true;shake=14;alive().forEach(s=>{s.cut=.5;hurtSlime(s,60,true);});}
      ult.frame=Math.min(M.ult.n-1,6+Math.floor(u*M.ult.fps));
      ult.dark=.62*(1-clamp(u/.5,0,1));ult.streak=1-clamp(u/.35,0,1);
      if(ult.frame>=M.ult.n-1&&u>(M.ult.n-6)/M.ult.fps){
        hero.anim='idle';hero.t=0;ult=null;
        const left=alive();
        if(left.length){mode='battle';modeT=0;hero.x=HX;}
        else{mode='win';modeT=0;endT=0;}
      }
    }
    updateDying(dt);
  }else if(mode==='tornado'){
    const cl=M.tornado;
    tor.t+=dt;hero.t=tor.t;
    const idx=Math.min(Math.floor(tor.t*cl.fps),cl.n-1);
    hero.x=idx<27?lerp(tor.from,CX,ease(idx/27)):CX;
    while(tor.k<TICKS.length&&idx>=TICKS[tor.k]){tor.k++;shake=7;alive().forEach(s=>hurtSlime(s,5));}
    const f=clamp((idx-26)/10,0,1),fe=ease(f);
    for(const s of slimes){
      if(s.st==='alive'){
        s.x=lerp(s.x0,CX+s.off,fe);
        s.lift=fe*(55+22*Math.sin(time*9+s.ph));
        s.rot=fe*.55*Math.sin(time*8+s.ph);
        s.moving=false;
      }
    }
    updateDying(dt);
    if(tor.t>=cl.n/cl.fps){
      hero.anim='idle';hero.t=0;tor=null;gain(25);
      const left=alive();
      if(left.length){mode='battle';modeT=0;hero.x=HX;left.forEach(s=>{s.lift=0;s.rot=0;});}
      else{mode='win';modeT=0;endT=0;}
    }
  }else if(mode==='pdash'){
    pd.t+=dt;hero.t+=dt;const T=pd.t;
    if(T<.30){hero.x=pd.from;}
    else if(T<.60){const p=(T-.30)/.30;hero.x=lerp(pd.from,pd.to,ease(p));for(const s of alive())if(!pd.h1.has(s)&&hero.x>=s.x-70){pd.h1.add(s);hurtSlime(s,8);s.kb=20;shake=4;}}
    else if(T<1.05){hero.x=pd.to;for(const s of alive())if(!pd.h1.has(s)){pd.h1.add(s);hurtSlime(s,8);s.kb=20;}if(!pd.sl){pd.sl=1;shake=8;}}
    else if(T<1.35){const p=(T-1.05)/.30;hero.x=lerp(pd.to,pd.from,ease(p));for(const s of alive())if(!pd.h2.has(s)&&hero.x<=s.x+40){pd.h2.add(s);hurtSlime(s,7);s.kb=20;shake=4;}}
    else{hero.x=pd.from;}
    updateDying(dt);
    if(T>=1.35+.60){hero.anim='idle';hero.t=0;pd=null;mode='battle';modeT=0;gain(10);}
  }else if(mode==='win'||mode==='lose'){
    hero.t+=dt;endT+=dt;updateDying(dt);
  }
}
function updateDying(dt){for(const s of slimes)if(s.st==='dying'){s.dt+=dt;if(s.dt>.4)s.st='dead';}}
function updateSlimes(dt){
  const al=alive();
  al.forEach((s,r)=>{
    if(s.stun>0){s.stun-=dt;s.moving=false;return;}
    const tx=hero.x+175+r*80;
    const d=tx-s.x,step=Math.min(Math.abs(d),(mode==='intro'?110:70)*dt);
    s.x+=Math.sign(d)*step;s.moving=step>.01;
    if(mode==='battle'&&r===0&&Math.abs(d)<6&&hero.hp>0){
      if(s.lunge<=0){s.cd-=dt;if(s.cd<=0){s.lunge=.5;s.lh=false;s.cd=2.3+Math.random();}}
    }
    if(s.lunge>0){
      s.lunge-=dt;const p=1-s.lunge/.5;
      if(!s.lh&&p>=.5){s.lh=true;hurtHero(TANKS.includes(sel)?5:8);}
    }
  });
  updateDying(dt);
}

/* ---------- dibujo ---------- */
function txt(str,x,y,size,col,align){
  ctx.font='800 '+size+'px system-ui,-apple-system,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(4,size/5);ctx.strokeStyle='#14161a';ctx.strokeText(str,x,y);
  ctx.fillStyle=col||'#fff';ctx.fillText(str,x,y);
}
function heart(x,y,r){
  ctx.beginPath();ctx.moveTo(x,y+r*.9);
  ctx.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.8,y-r*1.3,x,y-r*.45);
  ctx.bezierCurveTo(x+r*.8,y-r*1.3,x+r*1.6,y-r*.2,x,y+r*.9);ctx.closePath();
}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9bd8ff');g.addColorStop(.62,'#e4f6ff');g.addColorStop(.62,'#7fd07a');g.addColorStop(1,'#4fae5a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8fcf93';
  ctx.beginPath();ctx.moveTo(0,334);ctx.quadraticCurveTo(160,250,330,330);ctx.quadraticCurveTo(480,280,640,334);ctx.quadraticCurveTo(800,270,960,330);ctx.lineTo(960,336);ctx.lineTo(0,336);ctx.fill();
  ctx.fillStyle='#fff';
  for(const [cx,cy,r] of [[150,90,34],[210,80,44],[270,92,32],[700,60,30],[760,52,42],[820,64,30]]){ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,336,W,6);
  ctx.fillStyle='#5db866';
  for(let i=0;i<14;i++){const x=(i*83+40)%W,y=360+((i*47)%150);ctx.fillRect(x,y,26,5);}
}
function drawSlime(s){
  if(s.st==='dead')return;
  let sq=s.moving?Math.sin(time*10+s.ph)*.14:Math.sin(time*3+s.ph)*.05;
  let sc=1,alpha=1;
  if(s.st==='dying'){const p=s.dt/.4;sq=-.35*p;sc=1+.3*p;alpha=1-p;}
  const w=72*(1+sq)*sc,h=54*(1-sq)*sc;
  let ox=s.kb,oy=0;
  if(s.lunge>0){const p=1-s.lunge/.5;ox-=46*Math.sin(Math.PI*p);oy=-14*Math.sin(Math.PI*p);}
  const hop=s.moving?-Math.abs(Math.sin(time*10+s.ph))*10:0;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(s.x+ox,s.y+3,w*.5,8,0,0,7);ctx.fill();
  ctx.translate(s.x+ox,s.y+oy+hop-s.lift);ctx.rotate(s.rot);
  ctx.beginPath();ctx.moveTo(-w/2,0);
  ctx.bezierCurveTo(-w/2,-h*.95,-w*.28,-h*1.05,0,-h*1.05);
  ctx.bezierCurveTo(w*.28,-h*1.05,w/2,-h*.95,w/2,0);
  ctx.quadraticCurveTo(0,7,-w/2,0);ctx.closePath();
  ctx.fillStyle=s.flash>0?'#fff':s.col;ctx.fill();
  ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#14161a';ctx.stroke();
  if(s.flash<=0){
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-w*.2,-h*.78,w*.1,h*.1,-.5,0,7);ctx.fill();
    for(const ex of [-w*.2,w*.12]){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-h*.46,8,10,0,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#14161a';ctx.beginPath();ctx.arc(ex-3,-h*.44,4.5,0,7);ctx.fill();
    }
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(-w*.04,-h*.22,6,.15*Math.PI,.85*Math.PI);ctx.stroke();
  }
  if(s.cut>0){
    ctx.lineCap='round';
    ctx.strokeStyle='#14161a';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-w*.62,-h*.05);ctx.lineTo(w*.62,-h*1.0);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke();
  }

const endDrag=e=>{
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved&&e.type==='pointerup'){const [x,y]=pt(e);press(x,y);}
};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{if(mode==='select'){e.preventDefault();selOff=clamp(selOff+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY),0,maxOff());}},{passive:false});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(mode==='detail'){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();startGame(dsel);}if(e.code==='Escape')mode='select';if(e.code==='ArrowRight')detailStep(1);if(e.code==='ArrowLeft')detailStep(-1);return;}
  if(mode==='select'){const m=/^Digit([1-9])$/.exec(e.code);if(m&&PANELS[+m[1]-1])openDetail(PANELS[+m[1]-1].id);if(e.code==='ArrowRight')selOff=clamp(selOff+164,0,maxOff());if(e.code==='ArrowLeft')selOff=clamp(selOff-164,0,maxOff());return;}
  if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();if(mode==='win'||mode==='lose'){if(endT>.5)mode='select';}else actAttack();}
  if(e.code==='KeyL')actSkill();
  if(e.code==='KeyK'||e.code==='KeyU')actUlt();
});

/* ---------- bucle ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!(paused&&mode!=='select'&&mode!=='detail'&&mode!=='loading'))for(let k=0;k<SPEED;k++)update(dt);draw();requestAnimationFrame(loop);
}
const jobs=[];
for(const id in HEROES)jobs.push(loadClip(id,'thumb'));
Promise.all(jobs).then(()=>{
  document.getElementById('load').style.display='none';
  use('sword');mode='select';requestAnimationFrame(loop);
});
</script></body></html>
