  const i=Math.floor(x),j=Math.floor(y);if(i<1||j<1||i>=MW-1||j>=MH-1)return false;

const ENM={"champWalkF":{"fw":29,"fh":33,"n":17,"ax":14,"ay":32},"champWalkB":{"fw":30,"fh":33,"n":28,"ax":15,"ay":32},"champAtkF":{"fw":62,"fh":33,"n":18,"ax":41,"ay":32,"hit":12},"champAtkB":{"fw":51,"fh":32,"n":20,"ax":21,"ay":32,"hit":12},"puffWalkF":{"fw":32,"fh":45,"n":33,"ax":16,"ay":45},"puffWalkB":{"fw":33,"fh":45,"n":33,"ax":16,"ay":45},"puffAtkF":{"fw":106,"fh":68,"n":28,"ax":88,"ay":40,"hit":12},"puffAtkB":{"fw":103,"fh":65,"n":26,"ax":21,"ay":65,"hit":10},"bossWalkF":{"fw":68,"fh":81,"n":44,"ax":34,"ay":80},"bossWalkB":{"fw":63,"fh":81,"n":40,"ax":31,"ay":80},"bossAtkF":{"fw":116,"fh":85,"n":35,"ax":79,"ay":79,"hit":11},"bossAtkB":{"fw":120,"fh":87,"n":41,"ax":40,"ay":81,"hit":18},"bossAt2F":{"fw":130,"fh":87,"n":33,"ax":66,"ay":80,"hit":13},"bossAt2B":{"fw":133,"fh":89,"n":30,"ax":66,"ay":82,"hit":15}};

{const pl=[];const put=(t,z,n)=>{const R=ZR[z];let c=0,tr=0;while(c<n&&tr<900){tr++;const x=R[0]+rnd()*(R[1]-R[0]),y=1.5+rnd()*(MH-3);

function emMenu(){const m=document.getElementById('emn');m.innerHTML='';
  const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{f();m.classList.remove('on');};m.appendChild(b);};
  if(hero.em&&hero.em.ph<2)add('Levantarse',()=>emOut());else{add('Sentarse',()=>emStart('sit'));add('Acostarse',()=>emStart('lie'));}
  const sm=document.createElement('small');sm.textContent='Muévete o ataca para levantarte';m.appendChild(sm);}
document.getElementById('eb').onclick=()=>{const m=document.getElementById('emn');if(m.classList.contains('on'))m.classList.remove('on');else{emMenu();m.classList.add('on');}};
document.getElementById('hb').style.backgroundImage='url('+ICONS.helm().toDataURL()+')';
const DESC={lena:['Leña','Sirve para crear objetos.'],espora:['Espora','Sirve para subir de nivel al héroe: cada una da +20 de experiencia.'],sombrero:['Sombrero','Sirve para subir el nivel de las habilidades del héroe.']};
function invShow(k){const d=document.getElementById('invd');d.innerHTML='';const b=document.createElement('b');b.textContent=DESC[k][0];d.appendChild(b);d.appendChild(document.createElement('br'));d.appendChild(document.createTextNode(DESC[k][1]));}
function invRender(){
  const g=document.getElementById('invr');g.innerHTML='';
  const items=[['lena',bag.mad],['espora',bag.esp],['sombrero',bag.somb]];
  for(let i=0;i<24;i++){const d=document.createElement('div');d.className='slot';const it=items[i];
    if(it){d.appendChild(ICONS[it[0]]());const b=document.createElement('b');b.textContent=it[1];d.appendChild(b);
      d.addEventListener('pointerenter',()=>invShow(it[0]));d.addEventListener('pointerdown',()=>invShow(it[0]));}
    g.appendChild(d);}
}
const SKN=[['atk','Ataque básico'],['onda','Espadas del cielo (ONDA)'],['ult','Ultimate']];
function pjRender(){
  const n=document.getElementById('pjn');n.innerHTML='<b>Guerrero · Nv '+LV.lvl+(LV.lvl>=LVMAX?' (máx)':'')+'</b><div class="xpb"><i style="width:'+(LV.lvl>=LVMAX?100:Math.round(LV.xp/xpNeed(LV.lvl)*100))+'%"></i></div><small>'+(LV.lvl>=LVMAX?'Nivel máximo':'XP '+LV.xp+' / '+xpNeed(LV.lvl))+'<br>Cada nivel: +3% daño, +2 vida<br>Vida máx '+hero.mhp+'</small>';
  const r=document.getElementById('pjr');r.innerHTML='';
  const row=(ic,html,btn)=>{const d=document.createElement('div');d.className='pr';d.appendChild(ICONS[ic]());const t=document.createElement('div');t.className='pt';t.innerHTML=html;d.appendChild(t);if(btn)d.appendChild(btn);r.appendChild(d);};
  const ub=document.createElement('button');ub.textContent='Usar';ub.disabled=bag.esp<1||LV.lvl>=LVMAX;
  ub.onclick=()=>{if(bag.esp<1||LV.lvl>=LVMAX)return;bag.esp--;addXp(20);pjRender();};
  row('espora','<b>Esporas: '+bag.esp+'</b><br>Cada una da +20 XP al héroe',ub);
  const sp=document.createElement('div');sp.className='pr';sp.appendChild(ICONS.sombrero());const st=document.createElement('div');st.className='pt';st.innerHTML='<b>Sombreros: '+bag.somb+'</b><br>Mejoran tus habilidades (el dash no sube)';sp.appendChild(st);r.appendChild(sp);
  SKN.forEach(([k,nm])=>{const l=LV.sk[k],cost=l,b=document.createElement('button');
    if(l>=SKMAX){b.textContent='MÁX';b.disabled=true;}else{b.appendChild(document.createTextNode('+'));b.appendChild(ICONS.sombrero());b.appendChild(document.createTextNode(cost));b.disabled=bag.somb<cost;}
    b.onclick=()=>{if(LV.sk[k]>=SKMAX||bag.somb<LV.sk[k])return;bag.somb-=LV.sk[k];LV.sk[k]++;pjRender();};
    const d=document.createElement('div');d.className='pr';const t=document.createElement('div');t.className='pt';t.innerHTML='<b>'+nm+'</b><br>Nv '+l+'/'+SKMAX+' · daño +'+Math.round(12*(l-1))+'%';d.appendChild(t);d.appendChild(b);r.appendChild(d);});
}
function invOpen(v,mode){INV.open=v;INV.mode=v?mode:null;const e=document.getElementById('inv');e.classList.toggle('on',v);e.classList.toggle('pj',v&&mode==='pj');
  if(v){invLoop.sig=null;mode==='pj'?pjRender():invRender();invLoop();}}
function invLoop(){if(!INV.open)return;
  const pj=INV.mode==='pj',c=document.getElementById(pj?'pjc':'invc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;
  const n=72,P=2*n-2,k=Math.floor(performance.now()/41.7)%P,fi=k<n?k:P-k,im=IMG['hero/panelF'],Z=3;
  x.drawImage(im,fi*47,0,47,41,Math.round(c.width/2-21*Z),c.height-41*Z-6,47*Z,41*Z);
  const sig=bag.mad+','+bag.esp+','+bag.somb;if(sig!==invLoop.sig){invLoop.sig=sig;pj?pjRender():invRender();}
  requestAnimationFrame(invLoop);}
document.getElementById('bp').onclick=()=>invOpen(!(INV.open&&INV.mode==='inv'),'inv');
document.getElementById('hb').onclick=()=>invOpen(!(INV.open&&INV.mode==='pj'),'pj');
document.getElementById('invx').onclick=()=>invOpen(false);
document.getElementById('pjx').onclick=()=>invOpen(false);
document.getElementById('inv').addEventListener('pointerdown',e=>{if(e.target.id==='inv')invOpen(false);});
addEventListener('keydown',e=>{if(e.key==='i')invOpen(!(INV.open&&INV.mode==='inv'),'inv');else if(e.key==='p')invOpen(!(INV.open&&INV.mode==='pj'),'pj');else if(e.key==='Escape'&&INV.open)invOpen(false);});
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  let dtu=dt;if(hs>0){hs-=dt;dtu=0;}if(INV.open)dtu=0;
  frameDt=dt;update(dtu,t);fxUpdate(dt);
  const dpr=window.devicePixelRatio||1, W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const S=Math.max(1,Math.round(W/820)+zoomAdj), vw=W/S, vh=H/S;
  const [hx,hy]=S2(hero.x,hero.y);
  if(!cam)cam={x:hx,y:hy-20};
  if(hero.dash>0)camSp=0;else camSp=Math.min(5,camSp+dt*3);const cs=camSp;if(hero.dash<=0)cam.x+=(hx-cam.x)*Math.min(1,dt*cs);
  if(hero.dash<=0)cam.y+=(hy-20-cam.y)*Math.min(1,dt*cs);
  const shx=shake.t>0?Math.round((Math.random()*2-1)*shake.m):0, shy=shake.t>0?Math.round((Math.random()*2-1)*shake.m):0;
  const ox=Math.round(vw/2-cam.x)+shx, oy=Math.round(vh/2-cam.y)+shy;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#060b0a';ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  ctx.setTransform(S,0,0,S,ox*S,oy*S);
  // suelo
  for(let s=0;s<MW+MH;s++)for(let i=0;i<MW;i++){const j=s-i;if(j<0||j>=MH)continue;
    const [cx,cy]=S2(i+.5,j+.5);if(Math.abs(cx-cam.x)>vw/2+HW+4||Math.abs(cy-cam.y)>vh/2+HH+66)continue;
    groundTile(i,j,cx,cy);}
  for(const b of BRG)ctx.drawImage(b.cv,b.ox,b.oy);
  ctx.drawImage(SHORE.cv,SHORE.ox,SHORE.oy);
  drawRings();
  // objetos ordenados
  const list=stat.slice();
  for(const t of tufts){if(Math.abs(t.sx-cam.x)<vw/2+8&&Math.abs(t.sy-cam.y)<vh/2+8)list.push(t.o);}
  list.push({k:hero.x+hero.y,f:drawHero});
  for(const w of waves)list.push({k:w.x+w.y,f:()=>drawWave(w)});for(const w of swords)list.push({k:w.x+w.y+.2,f:()=>drawSword(w)});for(const c of slashes)list.push({k:c.x+c.y+.6,f:()=>drawSlash(c)});
  for(const m of mushes)if(m.alive)list.push({k:m.x+m.y,f:()=>drawMush(m)});
  for(const d of drops)list.push({k:d.x+d.y,f:()=>drawDrop(d)});
  list.sort((a,b)=>a.k-b.k);
  for(const o of list)o.f();
  drawParts();drawFloats();
  // brasas
  ctx.globalCompositeOperation='lighter';
  for(const e of embers){ctx.fillStyle='rgba(255,'+(120+Math.round(e.l*90))+',50,'+(e.l*.9)+')';ctx.fillRect(Math.round(e.x),Math.round(e.y),2,2);}
  for(const f of flies){const [sx,sy]=S2(f.x,f.y);const a=.35+.65*Math.max(0,Math.sin(t*2.2+f.ph));
    ctx.fillStyle='rgba(220,255,140,'+a+')';ctx.fillRect(sx,sy-18-(f.ph*3%14),2,2);}
  ctx.globalCompositeOperation='source-over';
  lighting(S,ox,oy,t);
  drawHud(dpr);
  // joystick
  if(joy){ctx.setTransform(1,0,0,1,0,0);const k=dpr;
    ctx.strokeStyle='rgba(220,255,220,.55)';ctx.lineWidth=2*k;ctx.beginPath();ctx.arc(joy.ox*k,joy.oy*k,50*k,0,6.283);ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    ctx.fillStyle='rgba(220,255,220,.4)';ctx.beginPath();ctx.arc((joy.ox+Math.cos(a)*d)*k,(joy.oy+Math.sin(a)*d)*k,22*k,0,6.283);ctx.fill();}
  fpsN++;fpsT+=dt;if(fpsT>=.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;}
  document.getElementById('ub').textContent=hero.ultCd>0?Math.ceil(hero.ultCd):'ULT';document.getElementById('db').textContent=hero.dashCd>0?Math.ceil(hero.dashCd):'DASH';document.getElementById('sb').textContent=hero.skillCd>0?Math.ceil(hero.skillCd):'ONDA';hud.textContent=VER+' · zoom x'+S+' · '+fps+' fps\nArrastra para moverte (WASD) · ATK J · DASH K · ONDA L · ULT espacio';
  hud.style.whiteSpace='pre';
  requestAnimationFrame(frame);
}
})();
