<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Exploración isométrica (prueba)</title>
<style>
html,body{margin:0;height:100%;background:#070d0c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:8px;top:max(6px,env(safe-area-inset-top));color:#cfe8d0;font:600 12px system-ui,sans-serif;opacity:.85;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.35}
#zoom{position:fixed;right:8px;top:max(6px,env(safe-area-inset-top));display:flex;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid #4c6a52;background:#10201acc;color:#cfe8d0;font:700 20px system-ui;touch-action:manipulation}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe8d0;font:600 16px system-ui,sans-serif;text-align:center;padding:20px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="zoom"><button id="zm">&minus;</button><button id="zp">+</button></div>
<div id="msg">Cargando…</div>
<script>
(()=>{
'use strict';
const VER='iso-prueba v1';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dark=document.createElement('canvas'), dctx=dark.getContext('2d');
const hud=document.getElementById('hud'), msg=document.getElementById('msg');
const names=['grass_a','grass_b','grass_c','grass_d','path_a','cliff_l','cliff_r','block','tree','stump','mush'];
const IMG={}; let loaded=0, failed=null;
names.forEach(n=>{const im=new Image();
  im.onload=()=>{if(++loaded===names.length&&!failed){msg.remove();requestAnimationFrame(frame);}};
  im.onerror=()=>{failed=n;msg.textContent='No cargó la imagen: '+n;};
  im.src='assets/iso/'+n+'.png?v=1';IMG[n]=im;});

/* ---------- mapa ---------- */
const HW=55, HH=28, LH=34;          // medio ancho / medio alto de la casilla, alto de un piso
const MW=18, MH=16;
const terrace=(i,j)=>i>=10&&i<=15&&j>=2&&j<=6;
const blocks=[[4,9],[5,9],[4,10]];
const blockSet=new Set(blocks.map(b=>b.join(',')));
const pathSet=new Set(['2,7','3,7','4,7','5,7','5,6','6,6','6,5','7,5','8,5','9,5','9,6','9,7','9,8','8,8','8,9']);
const trees=[[1.5,1.5],[3.5,0.8],[0.8,4.5],[2.6,12.5],[5.4,13.5],[8.5,14.2],[12.4,12.6],[15.5,10.5],[16.6,13.2],
 [16.3,7.5],[1.4,9.5],[7.2,2.0],[8.8,1.4],[5.0,3.0],[13.0,9.5],[11.2,13.8],[0.8,13.2],[9.4,11.2],[6.6,9.8],[3.0,6.2],
 [11.5,3.4],[13.6,3.2],[14.5,5.4],[10.8,5.6],[12.6,4.6]];
const STUMP=[7.5,5.5];
const mushes=[[7.5,9.5],[12.5,10.5],[3.5,4.5],[14.5,13.5]].map((p,k)=>({x:p[0],y:p[1],tx:p[0],ty:p[1],wait:Math.random()*2,face:-1,ph:k*1.7}));
const hero={x:6.5,y:7.8,z:0,face:1,walk:0,moving:false};
const R=0.17;
{const q=new URLSearchParams(location.search);if(q.get('x'))hero.x=+q.get('x');if(q.get('y'))hero.y=+q.get('y');}

const cellSolid=(i,j)=>terrace(i,j)||blockSet.has(i+','+j);
function blockedAt(x,y,r){
  if(x<r||y<r||x>MW-r||y>MH-r) return true;
  for(let i=Math.floor(x-r);i<=Math.floor(x+r);i++)for(let j=Math.floor(y-r);j<=Math.floor(y+r);j++){
    if(!cellSolid(i,j))continue;
    const cx=Math.max(i,Math.min(x,i+1)), cy=Math.max(j,Math.min(y,j+1));
    if((x-cx)**2+(y-cy)**2<r*r) return true;
  }
  for(const t of trees){ if(t[0]>=10&&t[0]<16&&t[1]>=2&&t[1]<7)continue; if((x-t[0])**2+(y-t[1])**2<(0.2+r)**2) return true; }
  if((x-STUMP[0])**2+(y-STUMP[1])**2<(0.4+r)**2) return true;
  return false;
}

/* ---------- dibujo ---------- */
const S2=(wx,wy)=>[Math.round((wx-wy)*HW),Math.round((wx+wy)*HH)];
function pixShadow(x,y,rx,ry,a){
  ctx.fillStyle='rgba(0,0,0,'+a+')';
  for(let dy=-ry;dy<=ry;dy++){const h=Math.round(rx*Math.sqrt(1-(dy/(ry+0.5))**2));ctx.fillRect(x-h,y+dy,h*2,1);}
}
function spr(name,wx,wy,z,ax,ay){const [sx,sy]=S2(wx,wy);ctx.drawImage(IMG[name],sx-ax,sy-z-ay);}
function drawHero(){
  const [sx,sy0]=S2(hero.x,hero.y); const sy=sy0-Math.round(hero.z);
  pixShadow(sx,sy,8,3,0.3);
  const f=hero.moving?Math.floor(hero.walk*2)%2:0, bob=hero.moving&&f?1:0;
  ctx.save(); ctx.translate(sx,sy-bob); ctx.scale(hero.face,1);
  const O='#1a1220';
  const R_=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  // contorno
  R_(O,-7,-23,14,12);R_(O,-6,-12,12,9);R_(O,-8,-11,16,6);
  // piernas
  const l=hero.moving&&f?1:0;
  R_(O,-5,-4,4,4);R_(O,1,-4+l,4,4-l);
  R_('#5a3a24',-4,-3,2,3);R_('#5a3a24',2,-3+l,2,3-l);
  R_('#3a3250',-4,-5,2,2);R_('#3a3250',2,-5,2,2);
  // cuerpo
  R_('#3b6fc4',-5,-12,10,7);R_('#5b8fe0',-5,-12,10,1);R_('#d8b04a',-5,-7,10,1);
  R_('#2a4f94',2,-11,3,4);
  R_('#c44040',-5,-12,10,1);
  // brazos
  R_('#3b6fc4',-7,-11,2,5);R_('#3b6fc4',5,-11,2,5);R_('#f0c8a0',-7,-6,2,1);R_('#f0c8a0',5,-6,2,1);
  // cabeza
  R_('#f0c8a0',-6,-22,12,10);R_('#d8a47c',-6,-13,12,1);
  R_('#6b3a2a',-6,-22,12,4);R_('#6b3a2a',-6,-18,2,3);R_('#6b3a2a',4,-18,2,2);R_('#8a5238',-3,-22,4,1);
  R_(O,-3,-16,2,2);R_(O,1,-16,2,2);R_('#ffffff',-3,-16,1,1);R_('#ffffff',1,-16,1,1);
  R_('#e0907c',-5,-14,2,1);R_('#e0907c',3,-14,2,1);
  ctx.restore();
}
function drawMush(m){
  const [sx,sy]=S2(m.x,m.y); const b=Math.round(Math.sin(performance.now()/260+m.ph)*1.2);
  pixShadow(sx,sy,9,3,0.3);
  ctx.save(); ctx.translate(sx,sy-b); ctx.scale(m.face,1);
  ctx.drawImage(IMG.mush,-18,-37); ctx.restore();
}

/* ---------- lista estática (ordenada por profundidad) ---------- */
const stat=[];
for(let i=0;i<MW;i++)for(let j=0;j<MH;j++){
  const [cx,cy]=S2(i+.5,j+.5);
  if(terrace(i,j)){
    stat.push({k:i+j,f:()=>ctx.drawImage(IMG['grass_'+'abcd'[(i*7+j*13)%4]],cx-HW,cy-LH-HH)});
    if(!terrace(i,j+1)) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_l,cx-HW,cy-LH)});
    if(!terrace(i+1,j)) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_r,cx+HW-59,cy-LH)});
  }else{
    if(j===MH-1) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_l,cx-HW,cy)});
    if(i===MW-1) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_r,cx+HW-59,cy)});
  }
}
for(const [i,j] of blocks){const [cx,cy]=S2(i+.5,j+.5);stat.push({k:i+j+.6,f:()=>ctx.drawImage(IMG.block,cx-58,cy+HH-104)});}
for(const t of trees){
  const z=(t[0]>=10&&t[0]<16&&t[1]>=2&&t[1]<7)?LH:0;
  stat.push({k:t[0]+t[1],f:()=>{const [sx,sy]=S2(t[0],t[1]);pixShadow(sx,sy-z,15,5,0.28);spr('tree',t[0],t[1],z,35,81);}});
}
stat.push({k:STUMP[0]+STUMP[1],f:()=>{const [sx,sy]=S2(STUMP[0],STUMP[1]);pixShadow(sx,sy,26,8,0.3);spr('stump',STUMP[0],STUMP[1],0,42,74);}});

/* ---------- cámara, entrada, partículas ---------- */
let zoomAdj=0, cam=null;
document.getElementById('zm').onclick=()=>{zoomAdj--;};
document.getElementById('zp').onclick=()=>{zoomAdj++;};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
let joy=null;
cv.addEventListener('pointerdown',e=>{if(joy)return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY;}});
const endJ=e=>{if(joy&&joy.id===e.pointerId)joy=null;};
cv.addEventListener('pointerup',endJ);cv.addEventListener('pointercancel',endJ);
function inputVec(){
  let ux=0,uy=0;
  if(keys.a||keys.arrowleft)ux-=1; if(keys.d||keys.arrowright)ux+=1;
  if(keys.w||keys.arrowup)uy-=1; if(keys.s||keys.arrowdown)uy+=1;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>10){const m=Math.min(1,(d-10)/50);ux=dx/d*m;uy=dy/d*m;}}
  const l=Math.hypot(ux,uy); if(l>1){ux/=l;uy/=l;}
  return [ux,uy];
}
const embers=[], flies=[];
for(let k=0;k<26;k++)flies.push({x:Math.random()*MW,y:Math.random()*MH,ph:Math.random()*6.28,sp:.15+Math.random()*.25,a:Math.random()*6.28});
let emberT=0;

function update(dt,t){
  const [ux,uy]=inputVec();
  hero.moving=(ux||uy)?true:false;
  if(hero.moving){
    const sp=95; // px de pantalla por segundo
    const wx=(ux/HW+uy/HH)/2*sp*dt, wy=(uy/HH-ux/HW)/2*sp*dt;
    if(!blockedAt(hero.x+wx,hero.y,R))hero.x+=wx;
    if(!blockedAt(hero.x,hero.y+wy,R))hero.y+=wy;
    if(ux)hero.face=ux>0?1:-1;
    hero.walk+=dt*4.2;
  }
  for(const m of mushes){
    m.wait-=dt;
    if(m.wait<=0&&Math.hypot(m.tx-m.x,m.ty-m.y)<0.05){
      const nx=m.x+(Math.random()-.5)*2.4, ny=m.y+(Math.random()-.5)*2.4;
      const ci=Math.floor(nx),cj=Math.floor(ny);
      if(nx>.5&&ny>.5&&nx<MW-.5&&ny<MH-.5&&!cellSolid(ci,cj)&&!blockedAt(nx,ny,.15)){m.tx=nx;m.ty=ny;}
      m.wait=1+Math.random()*2;
    }
    const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);
    if(d>0.03){const s=Math.min(d,0.55*dt);m.x+=dx/d*s;m.y+=dy/d*s;const sx=(dx-dy);if(Math.abs(sx)>.01)m.face=sx>0?1:-1;}
  }
  emberT-=dt;
  if(emberT<=0){emberT=.09;const [fx,fy]=S2(STUMP[0],STUMP[1]);embers.push({x:fx+(Math.random()*8-4),y:fy-60,vx:Math.random()*6-3,vy:-(14+Math.random()*14),l:1});}
  for(let k=embers.length-1;k>=0;k--){const e=embers[k];e.x+=e.vx*dt;e.y+=e.vy*dt;e.l-=dt*.9;if(e.l<=0)embers.splice(k,1);}
  for(const f of flies){f.a+=dt*f.sp;f.x+=Math.cos(f.a)*dt*.25;f.y+=Math.sin(f.a*1.3)*dt*.25;f.x=Math.max(0,Math.min(MW,f.x));f.y=Math.max(0,Math.min(MH,f.y));}
}

/* ---------- luz ---------- */
function lighting(S,ox,oy,t){
  const w=cv.width,h=cv.height;
  if(dark.width!==w||dark.height!==h){dark.width=w;dark.height=h;}
  dctx.setTransform(1,0,0,1,0,0);
  dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,w,h);
  dctx.fillStyle='rgba(3,11,18,0.66)';dctx.fillRect(0,0,w,h);
  dctx.globalCompositeOperation='destination-out';
  const L=(wx,wy,zz,r,a)=>{const [sx,sy]=S2(wx,wy);const x=(sx+ox)*S,y=(sy-zz+oy)*S;
    const g=dctx.createRadialGradient(x,y,0,x,y,r*S);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(.6,'rgba(0,0,0,'+(a*.45)+')');g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;dctx.fillRect(x-r*S,y-r*S,r*S*2,r*S*2);};
  L(6.5,6.2,0,260,.62); L(13,4.4,LH,230,.55); L(12.5,11,0,200,.4); L(3.5,11,0,170,.3);
  const fl=1+Math.sin(t*9)*.06+Math.sin(t*23)*.04;
  L(STUMP[0],STUMP[1],50,190*fl,.95);
  L(hero.x,hero.y,hero.z+10,95,.55);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.drawImage(dark,0,0);
  // brillo cálido de la fogata
  ctx.globalCompositeOperation='lighter';
  {const [sx,sy]=S2(STUMP[0],STUMP[1]);const x=(sx+ox)*S,y=(sy-50+oy)*S,r=150*S*fl;
   const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,150,60,.30)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
  // rayos de luz
  for(let k=0;k<3;k++){
    const bx=(w*(.28+k*.26))+Math.sin(t*.25+k*2)*w*.03, wd=w*.09, len=h*1.15;
    const g=ctx.createLinearGradient(bx,0,bx-len*.45,len);g.addColorStop(0,'rgba(255,240,170,.075)');g.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+wd,0);ctx.lineTo(bx+wd-len*.45,len);ctx.lineTo(bx-len*.45,len);ctx.closePath();ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // viñeta
  const vg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
}

/* ---------- bucle ---------- */
let last=performance.now(), fpsT=0, fpsN=0, fps=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  update(dt,t);
  const dpr=window.devicePixelRatio||1, W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const S=Math.max(1,Math.round(W/820)+zoomAdj), vw=W/S, vh=H/S;
  const [hx,hy]=S2(hero.x,hero.y);
  if(!cam)cam={x:hx,y:hy-20};
  cam.x+=(hx-cam.x)*Math.min(1,dt*5);cam.y+=(hy-20-cam.y)*Math.min(1,dt*5);
  const ox=Math.round(vw/2-cam.x), oy=Math.round(vh/2-cam.y);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#060b0a';ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  ctx.setTransform(S,0,0,S,ox*S,oy*S);
  // suelo
  for(let s=0;s<MW+MH;s++)for(let i=0;i<MW;i++){const j=s-i;if(j<0||j>=MH||terrace(i,j))continue;
    const [cx,cy]=S2(i+.5,j+.5);
    if(pathSet.has(i+','+j))ctx.drawImage(IMG.path_a,cx-58,cy-HH);
    else ctx.drawImage(IMG['grass_'+'abcd'[(i*7+j*13+((i*j)%5))%4]],cx-HW,cy-HH);}
  // objetos ordenados
  const list=stat.slice();
  list.push({k:hero.x+hero.y,f:drawHero});
  for(const m of mushes)list.push({k:m.x+m.y,f:()=>drawMush(m)});
  list.sort((a,b)=>a.k-b.k);
  for(const o of list)o.f();
  // brasas
  ctx.globalCompositeOperation='lighter';
  for(const e of embers){ctx.fillStyle='rgba(255,'+(120+Math.round(e.l*90))+',50,'+(e.l*.9)+')';ctx.fillRect(Math.round(e.x),Math.round(e.y),2,2);}
  for(const f of flies){const [sx,sy]=S2(f.x,f.y);const a=.35+.65*Math.max(0,Math.sin(t*2.2+f.ph));
    ctx.fillStyle='rgba(220,255,140,'+a+')';ctx.fillRect(sx,sy-18-(f.ph*3%14),2,2);}
  ctx.globalCompositeOperation='source-over';
  lighting(S,ox,oy,t);
  // joystick
  if(joy){ctx.setTransform(1,0,0,1,0,0);const k=dpr;
    ctx.strokeStyle='rgba(220,255,220,.55)';ctx.lineWidth=2*k;ctx.beginPath();ctx.arc(joy.ox*k,joy.oy*k,50*k,0,6.283);ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    ctx.fillStyle='rgba(220,255,220,.4)';ctx.beginPath();ctx.arc((joy.ox+Math.cos(a)*d)*k,(joy.oy+Math.sin(a)*d)*k,22*k,0,6.283);ctx.fill();}
  fpsN++;fpsT+=dt;if(fpsT>=.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;}
  hud.textContent=VER+' · zoom x'+S+' · '+fps+' fps\nToca y arrastra para moverte (o WASD)';
  hud.style.whiteSpace='pre';
  requestAnimationFrame(frame);
}
})();
</script>
</body></html>
