<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Héroes vs Slimes (prototipo)</title>
<style>
html,body{margin:0;height:100%;background:#10151c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 18px system-ui,sans-serif;background:#10151c;z-index:5}
#rot{position:fixed;left:0;right:0;top:4px;text-align:center;color:#ffe9a0;font:600 13px system-ui,sans-serif;display:none;pointer-events:none;z-index:4}
</style></head><body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="load">Cargando 0%</div>
<div id="rot">Gira el teléfono en horizontal para jugar mejor</div>
<script>
const MAN={"sword": {"anchor": [323, 333], "walk": {"n": 30, "x": 250, "y": 20, "w": 226, "h": 317, "fps": 10, "cols": 30}, "idle": {"n": 18, "x": 252, "y": 21, "w": 230, "h": 317, "fps": 8, "cols": 18}, "attack": {"n": 17, "x": 70, "y": 22, "w": 495, "h": 316, "fps": 14, "cols": 16}, "ult": {"n": 20, "x": 37, "y": 26, "w": 574, "h": 312, "fps": 12, "cols": 14}, "scale": 0.5844155844155844, "tornado": {"n": 87, "x": 105, "y": 0, "w": 432, "h": 348, "fps": 15, "cols": 18}}, "mage": {"anchor": [321, 339], "scale": 0.5863192182410424, "walk": {"n": 30, "x": 207, "y": 26, "w": 260, "h": 317, "fps": 10, "cols": 30}, "idle": {"n": 30, "x": 179, "y": 26, "w": 293, "h": 317, "fps": 10, "cols": 27}, "attack": {"n": 29, "x": 213, "y": 1, "w": 412, "h": 348, "fps": 15, "cols": 19}, "skill": {"n": 27, "x": 28, "y": 21, "w": 591, "h": 338, "fps": 12, "cols": 13}, "ult": {"n": 36, "x": 11, "y": 11, "w": 618, "h": 349, "fps": 12, "cols": 13}}, "tank": {"anchor": [321, 339], "scale": 0.6060606060606061, "idle": {"n": 36, "x": 253, "y": 39, "w": 190, "h": 304, "fps": 12, "cols": 36}, "walk": {"n": 36, "x": 243, "y": 37, "w": 244, "h": 308, "fps": 12, "cols": 33}, "attack": {"n": 34, "x": 75, "y": 15, "w": 530, "h": 345, "fps": 20, "cols": 15}, "skill": {"n": 36, "x": 45, "y": 17, "w": 544, "h": 342, "fps": 12, "cols": 15}, "ult": {"n": 36, "x": 15, "y": 15, "w": 610, "h": 344, "fps": 12, "cols": 13}}, "doc": {"anchor": [322, 345], "scale": 0.5787781350482315, "idle": {"n": 36, "x": 249, "y": 23, "w": 196, "h": 326, "fps": 12, "cols": 36}, "walk": {"n": 36, "x": 243, "y": 23, "w": 174, "h": 326, "fps": 12, "cols": 36}, "attack": {"n": 32, "x": 53, "y": 9, "w": 578, "h": 350, "fps": 22, "cols": 14}, "skill": {"n": 36, "x": 21, "y": 16, "w": 583, "h": 343, "fps": 12, "cols": 14}, "ult": {"n": 36, "x": 21, "y": 21, "w": 597, "h": 338, "fps": 12, "cols": 13}}, "ase": {"anchor": [323, 345], "scale": 0.594059405940594, "idle": {"n": 36, "x": 197, "y": 37, "w": 260, "h": 312, "fps": 12, "cols": 31}, "walk": {"n": 36, "x": 207, "y": 37, "w": 254, "h": 314, "fps": 12, "cols": 32}, "attack": {"n": 26, "x": 51, "y": 9, "w": 580, "h": 340, "fps": 18, "cols": 14}, "skill": {"n": 36, "x": 17, "y": 17, "w": 606, "h": 342, "fps": 16, "cols": 13}, "ult": {"n": 36, "x": 108, "y": 15, "w": 517, "h": 344, "fps": 14, "cols": 15}}, "ring": {"anchor": [326, 341], "scale": 0.6060606060606061, "idle": {"n": 36, "x": 191, "y": 39, "w": 334, "h": 306, "fps": 12, "cols": 24}, "walk": {"n": 36, "x": 203, "y": 37, "w": 282, "h": 310, "fps": 12, "cols": 29}, "attack": {"n": 33, "x": 199, "y": 13, "w": 428, "h": 346, "fps": 18, "cols": 19}, "skill": {"n": 36, "x": 17, "y": 17, "w": 606, "h": 342, "fps": 14, "cols": 13}, "ult": {"n": 36, "x": 15, "y": 15, "w": 610, "h": 344, "fps": 14, "cols": 13}}};
const VERSION=4;
const W=960,H=540,HY=392,HX=230,SY=400,CX=610;
const HEROES={sword:{name:'Espadachín',pre:'',moves:'Tajo · Tornado · Corte'},mage:{name:'Maga',pre:'m_',moves:'Rayo · Flash · Ultimate'},tank:{name:'Abuela',pre:'t_',moves:'Peluchazo · Abrazo · Oso'},doc:{name:'Doctor',pre:'d_',moves:'Látigo · Curar · Jeringa'},ase:{name:'Asesino',pre:'a_',moves:'Bate · Embiste · Jonrón'},ring:{name:'Hechicera',pre:'r_',moves:'Dardo · Runas · Anillo'}};
const CS={sword:{},mage:{},tank:{},doc:{},ase:{},ring:{}};
let sel='sword',M=MAN.sword,S=M.scale,AX=M.anchor[0],AY=M.anchor[1];
function use(id){sel=id;M=MAN[id];S=M.scale;AX=M.anchor[0];AY=M.anchor[1];}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let K=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const sc=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';
  cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);
  K=cv.width/W;
  document.getElementById('rot').style.display=innerHeight>innerWidth?'block':'none';
}
addEventListener('resize',resize);resize();

/* ---------- carga de cuadros ---------- */
let loaded=0,total=0;
for(const id in HEROES)for(const n in MAN[id])if(MAN[id][n].n)total++;
function loadClip(id,name){
  return new Promise(res=>{
    const im=new Image();
    im.onload=im.onerror=()=>{loaded++;document.getElementById('load').textContent='Cargando '+Math.round(loaded/total*100)+'%';res();};
    im.src='assets/'+HEROES[id].pre+name+'.webp';
    CS[id][name]=im;
  });
}
function drawClip(name,idx,x,y,alpha){
  const c=M[name],im=CS[sel][name];if(!im||!im.complete||!im.naturalWidth)return;
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.drawImage(im,(idx%c.cols)*c.w,Math.floor(idx/c.cols)*c.h,c.w,c.h,x+(c.x-AX)*S,y+(c.y-AY)*S,c.w*S,c.h*S);
  ctx.globalAlpha=1;
}

/* ---------- estado ---------- */
let mode='select',time=0,modeT=0,shake=0,endT=0,introDone=0;
const hero={x:-170,anim:'walk',t:0,hp:100,max:100,en:0,flash:0,cast:null,sk:0,skm:5};
let slimes=[],parts=[],floats=[],fx=[],ult=null,tor=null;
const TICKS=[32,38,44,50,56];
const COLORS=['#6fdc6a','#5cc9f2','#6fdc6a','#f58fb8','#ffd35c'];
function reset(){
  mode='intro';modeT=0;endT=0;introDone=0;
  hero.x=-170;hero.anim='walk';hero.t=0;hero.max=sel==='tank'?140:100;hero.hp=hero.max;hero.en=0;hero.flash=0;hero.cast=null;hero.sk=0;
  parts=[];floats=[];fx=[];ult=null;tor=null;
  slimes=Array.from({length:5},(_,i)=>({x:1010+i*60,y:SY,hp:40,max:40,st:'alive',ph:i*1.3,col:COLORS[i],flash:0,kb:0,cd:1.2+i*.25,lunge:0,lh:false,lift:0,rot:0,sc:1,dt:0,moving:true,stun:0,cut:0}));
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function addFloat(x,y,text,color,size){floats.push({x,y,text,color,size,life:.9});}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:.55+Math.random()*.3,col,r:4+Math.random()*5});}}
function hurtSlime(s,n,big){
  if(s.st!=='alive')return;
  s.hp-=n;s.flash=.12;s.kb=14;addFloat(s.x+(Math.random()-.5)*50,s.y-90-Math.random()*40,String(n),'#fff',big?46:28);
  if(s.hp<=0){s.st='dying';s.dt=0;burst(s.x,s.y-30,s.col,14);}
}
function hurtHero(n){
  if(mode!=='battle')return;
  if(hero.cast&&hero.cast.invuln)return;
  hero.hp=Math.max(0,hero.hp-n);hero.flash=.35;shake=6;addFloat(hero.x,HY-190,'-'+n,'#ff6b6b');
  if(hero.hp<=0){mode='lose';modeT=0;endT=0;hero.anim='idle';hero.cast=null;}
}
function alive(){return slimes.filter(s=>s.st==='alive').sort((a,b)=>a.x-b.x);}
function gain(n){hero.en=Math.min(100,hero.en+n);}
function idleOK(){return mode==='battle'&&hero.anim==='idle'&&hero.hp>0;}
function startCast(clip,hit,fn,invuln){hero.anim='cast';hero.t=0;hero.cast={clip,hit,fn,done:false,invuln:!!invuln};}

/* ---------- acciones ---------- */
function actAttack(){
  if(!idleOK())return;
  if(sel==='ring')startCast('attack',15,()=>{alive().slice(0,3).forEach((s,i)=>hurtSlime(s,[20,16,12][i]));gain(20);shake=4;});
  else if(sel==='ase')startCast('attack',11,()=>{const f=alive()[0];if(f&&f.x-hero.x<300){hurtSlime(f,24);f.kb=50;f.cd+=.8;gain(22);shake=6;}});
  else if(sel==='doc')startCast('attack',21,()=>{alive().slice(0,2).forEach((s,i)=>{hurtSlime(s,i?10:16);});gain(22);shake=4;});
  else if(sel==='tank')startCast('attack',16,()=>{const f=alive()[0];if(f&&f.x-hero.x<300){hurtSlime(f,18);f.kb=46;f.cd+=.8;gain(25);shake=5;}});
  else if(sel==='sword')startCast('attack',4,()=>{const f=alive()[0];if(f&&f.x-hero.x<290){hurtSlime(f,20);gain(25);shake=3;}});
  else startCast('attack',8,()=>{alive().slice(0,2).forEach(s=>{hurtSlime(s,22);gain(20);});shake=4;});
}
function actSkill(){
  if(!idleOK()||hero.sk>0)return;
  if(sel==='sword'){
    const al=alive();if(!al.length)return;
    hero.sk=hero.skm=8;mode='tornado';hero.anim='tornado';tor={t:0,from:hero.x,k:0};
    al.forEach((s,i)=>{s.x0=s.x;s.off=(i-2)*26;s.lunge=0;});
    return;
  }
  if(sel==='ring'){
    hero.sk=hero.skm=6;
    startCast('skill',22,()=>{shake=10;alive().forEach(s=>{hurtSlime(s,18);s.stun=2.5;});gain(10);});
    return;
  }
  if(sel==='ase'){
    hero.sk=hero.skm=6;
    startCast('skill',26,()=>{shake=12;alive().forEach(s=>hurtSlime(s,22));gain(10);},true);
    return;
  }
  if(sel==='doc'){
    hero.sk=hero.skm=6;
    startCast('skill',9,()=>{const h=Math.min(25,hero.max-hero.hp);hero.hp+=h;gain(12);addFloat(hero.x,HY-200,'+'+h,'#7dff9a',32);});
    return;
  }
  if(sel==='tank'){
    hero.sk=hero.skm=7;
    startCast('skill',12,()=>{const h=Math.min(15,hero.max-hero.hp);hero.hp+=h;gain(15);addFloat(hero.x,HY-200,'+'+h,'#7dff9a',30);},true);
    return;
  }
  hero.sk=hero.skm=5;
  startCast('skill',11,()=>{shake=7;alive().forEach(s=>{hurtSlime(s,15);s.stun=2.5;gain(8);});});
}
function actUlt(){
  if(!idleOK()||hero.en<100)return;
  hero.en=0;
  if(sel==='ring'){
    startCast('ult',20,()=>{shake=16;alive().forEach(s=>hurtSlime(s,60,true));},true);
  }else if(sel==='ase'){
    startCast('ult',27,()=>{shake=18;alive().forEach(s=>hurtSlime(s,60,true));},true);
  }else if(sel==='doc'){
    startCast('ult',14,()=>{shake=14;const h=Math.min(40,hero.max-hero.hp);hero.hp+=h;addFloat(hero.x,HY-200,'+'+h,'#7dff9a',34);alive().forEach(s=>{hurtSlime(s,30,true);s.stun=2.5;});},true);
  }else if(sel==='tank'){
    startCast('ult',16,()=>{shake=16;alive().forEach(s=>{hurtSlime(s,35,true);s.stun=3.5;});},true);
  }else if(sel==='mage'){
    startCast('ult',24,()=>{
      shake=14;
      fx.push({t:0,x:hero.x+40,y:HY-90});
      for(let i=0;i<34;i++)parts.push({x:hero.x+40,y:HY-90+(Math.random()-.5)*70,vx:350+Math.random()*650,vy:(Math.random()-.5)*160,life:.7+Math.random()*.5,col:Math.random()<.5?'#ff8fc0':'#ffd0e6',r:9+Math.random()*9,heart:true});
      alive().forEach(s=>hurtSlime(s,60,true));
    },true);
  }else{
    const al=alive();if(!al.length)return;
    const mx=Math.max(...al.map(s=>s.x));
    mode='ult';hero.anim='ult';
    ult={t:0,from:hero.x,to:Math.min(880,mx+130),frame:0,dark:0,streak:0,hit:false};
  }
}

/* ---------- actualización ---------- */
function update(dt){
  time+=dt;modeT+=dt;
  shake=Math.max(0,shake-dt*20);
  hero.flash=Math.max(0,hero.flash-dt);
  if(mode==='battle'||mode==='ult'||mode==='tornado')hero.sk=Math.max(0,hero.sk-dt);
  for(const s of slimes){s.flash=Math.max(0,s.flash-dt);s.kb*=Math.pow(.001,dt);s.cut=Math.max(0,(s.cut||0)-dt);}
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?0:520)*dt;});
  parts=parts.filter(p=>p.life>0);
  fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.8);
  floats.forEach(f=>{f.life-=dt;f.y-=40*dt;});
  floats=floats.filter(f=>f.life>0);

  if(mode==='intro'){
    hero.t+=dt;
    if(hero.x<HX){hero.x=Math.min(HX,hero.x+125*dt);if(hero.x>=HX){hero.anim='idle';hero.t=0;}}
    updateSlimes(dt);
    const f=alive()[0];
    if(hero.x>=HX&&f&&Math.abs(f.x-(hero.x+175))<5){introDone+=dt;if(introDone>.8){mode='battle';modeT=0;}}
  }else if(mode==='battle'){
    hero.t+=dt;
    if(hero.anim==='cast'){
      const c=hero.cast,cl=M[c.clip],fr=Math.floor(hero.t*cl.fps);
      if(!c.done&&fr>=c.hit){c.done=true;c.fn();}
      if(fr>=cl.n){hero.anim='idle';hero.t=0;hero.cast=null;}
    }
    updateSlimes(dt);
    if(alive().length===0&&slimes.every(s=>s.st!=='dying')){mode='win';modeT=0;endT=0;}
  }else if(mode==='ult'){
    const TA=.55,TD=.2;
    ult.t+=dt;
    if(ult.t<TA){
      ult.frame=Math.min(4,Math.floor(ult.t/TA*5));ult.dark=ease(ult.t/TA)*.62;hero.x=ult.from;
    }else if(ult.t<TA+TD){
      const p=(ult.t-TA)/TD;hero.x=lerp(ult.from,ult.to,ease(p));
      ult.frame=p<.5?5:6;ult.dark=.62;ult.streak=1;
      for(const s of alive()){if(hero.x>=s.x&&!s.cm){s.cm=true;s.cut=.7;}}
    }else{
      const u=ult.t-TA-TD;hero.x=ult.to;
      if(!ult.hit){ult.hit=true;shake=14;alive().forEach(s=>{s.cut=.5;hurtSlime(s,60,true);});}
      ult.frame=Math.min(M.ult.n-1,6+Math.floor(u*M.ult.fps));
      ult.dark=.62*(1-clamp(u/.5,0,1));ult.streak=1-clamp(u/.35,0,1);
      if(ult.frame>=M.ult.n-1&&u>(M.ult.n-6)/M.ult.fps){
        hero.anim='idle';hero.t=0;ult=null;
        const left=alive();
        if(left.length){mode='battle';modeT=0;hero.x=HX;}
        else{mode='win';modeT=0;endT=0;}
      }
    }
    updateDying(dt);
  }else if(mode==='tornado'){
    const cl=M.tornado;
    tor.t+=dt;hero.t=tor.t;
    const idx=Math.min(Math.floor(tor.t*cl.fps),cl.n-1);
    hero.x=idx<27?lerp(tor.from,CX,ease(idx/27)):CX;
    while(tor.k<TICKS.length&&idx>=TICKS[tor.k]){tor.k++;shake=7;alive().forEach(s=>hurtSlime(s,5));}
    const f=clamp((idx-26)/10,0,1),fe=ease(f);
    for(const s of slimes){
      if(s.st==='alive'){
        s.x=lerp(s.x0,CX+s.off,fe);
        s.lift=fe*(55+22*Math.sin(time*9+s.ph));
        s.rot=fe*.55*Math.sin(time*8+s.ph);
        s.moving=false;
      }
    }
    updateDying(dt);
    if(tor.t>=cl.n/cl.fps){
      hero.anim='idle';hero.t=0;tor=null;gain(25);
      const left=alive();
      if(left.length){mode='battle';modeT=0;hero.x=HX;left.forEach(s=>{s.lift=0;s.rot=0;});}
      else{mode='win';modeT=0;endT=0;}
    }
  }else if(mode==='win'||mode==='lose'){
    hero.t+=dt;endT+=dt;updateDying(dt);
  }
}
function updateDying(dt){for(const s of slimes)if(s.st==='dying'){s.dt+=dt;if(s.dt>.4)s.st='dead';}}
function updateSlimes(dt){
  const al=alive();
  al.forEach((s,r)=>{
    if(s.stun>0){s.stun-=dt;s.moving=false;return;}
    const tx=hero.x+175+r*80;
    const d=tx-s.x,step=Math.min(Math.abs(d),(mode==='intro'?110:70)*dt);
    s.x+=Math.sign(d)*step;s.moving=step>.01;
    if(mode==='battle'&&r===0&&Math.abs(d)<6&&hero.hp>0){
      if(s.lunge<=0){s.cd-=dt;if(s.cd<=0){s.lunge=.5;s.lh=false;s.cd=2.3+Math.random();}}
    }
    if(s.lunge>0){
      s.lunge-=dt;const p=1-s.lunge/.5;
      if(!s.lh&&p>=.5){s.lh=true;hurtHero(sel==='tank'?5:8);}
    }
  });
  updateDying(dt);
}

/* ---------- dibujo ---------- */
function txt(str,x,y,size,col,align){
  ctx.font='800 '+size+'px system-ui,-apple-system,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(4,size/5);ctx.strokeStyle='#14161a';ctx.strokeText(str,x,y);
  ctx.fillStyle=col||'#fff';ctx.fillText(str,x,y);
}
function heart(x,y,r){
  ctx.beginPath();ctx.moveTo(x,y+r*.9);
  ctx.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.8,y-r*1.3,x,y-r*.45);
  ctx.bezierCurveTo(x+r*.8,y-r*1.3,x+r*1.6,y-r*.2,x,y+r*.9);ctx.closePath();
}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9bd8ff');g.addColorStop(.62,'#e4f6ff');g.addColorStop(.62,'#7fd07a');g.addColorStop(1,'#4fae5a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8fcf93';
  ctx.beginPath();ctx.moveTo(0,334);ctx.quadraticCurveTo(160,250,330,330);ctx.quadraticCurveTo(480,280,640,334);ctx.quadraticCurveTo(800,270,960,330);ctx.lineTo(960,336);ctx.lineTo(0,336);ctx.fill();
  ctx.fillStyle='#fff';
  for(const [cx,cy,r] of [[150,90,34],[210,80,44],[270,92,32],[700,60,30],[760,52,42],[820,64,30]]){ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,336,W,6);
  ctx.fillStyle='#5db866';
  for(let i=0;i<14;i++){const x=(i*83+40)%W,y=360+((i*47)%150);ctx.fillRect(x,y,26,5);}
}
function drawSlime(s){
  if(s.st==='dead')return;
  let sq=s.moving?Math.sin(time*10+s.ph)*.14:Math.sin(time*3+s.ph)*.05;
  let sc=1,alpha=1;
  if(s.st==='dying'){const p=s.dt/.4;sq=-.35*p;sc=1+.3*p;alpha=1-p;}
  const w=72*(1+sq)*sc,h=54*(1-sq)*sc;
  let ox=s.kb,oy=0;
  if(s.lunge>0){const p=1-s.lunge/.5;ox-=46*Math.sin(Math.PI*p);oy=-14*Math.sin(Math.PI*p);}
  const hop=s.moving?-Math.abs(Math.sin(time*10+s.ph))*10:0;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(s.x+ox,s.y+3,w*.5,8,0,0,7);ctx.fill();
  ctx.translate(s.x+ox,s.y+oy+hop-s.lift);ctx.rotate(s.rot);
  ctx.beginPath();ctx.moveTo(-w/2,0);
  ctx.bezierCurveTo(-w/2,-h*.95,-w*.28,-h*1.05,0,-h*1.05);
  ctx.bezierCurveTo(w*.28,-h*1.05,w/2,-h*.95,w/2,0);
  ctx.quadraticCurveTo(0,7,-w/2,0);ctx.closePath();
  ctx.fillStyle=s.flash>0?'#fff':s.col;ctx.fill();
  ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#14161a';ctx.stroke();
  if(s.flash<=0){
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-w*.2,-h*.78,w*.1,h*.1,-.5,0,7);ctx.fill();
    for(const ex of [-w*.2,w*.12]){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-h*.46,8,10,0,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#14161a';ctx.beginPath();ctx.arc(ex-3,-h*.44,4.5,0,7);ctx.fill();
    }
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(-w*.04,-h*.22,6,.15*Math.PI,.85*Math.PI);ctx.stroke();
  }
  if(s.cut>0){
    ctx.lineCap='round';
    ctx.strokeStyle='#14161a';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-w*.62,-h*.05);ctx.lineTo(w*.62,-h*1.0);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke();
  }
  if(s.stun>0&&s.st==='alive'){
    for(let k=0;k<3;k++){const a=time*5+k*2.1;ctx.fillStyle='#ffd35c';ctx.beginPath();ctx.arc(Math.cos(a)*22,-h*1.2+Math.sin(a)*6,5,0,7);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#14161a';ctx.stroke();}
  }
  ctx.restore();
  if(s.st==='alive'&&s.hp<s.max){
    const bx=s.x+ox-24,by=s.y-h-14-s.lift;
    ctx.fillStyle='#14161a';ctx.fillRect(bx-2,by-2,52,10);ctx.fillStyle='#e0e0e0';ctx.fillRect(bx,by,48,6);
    ctx.fillStyle='#ff5a5a';ctx.fillRect(bx,by,48*s.hp/s.max,6);
  }
}
function drawHero(){
  ctx.fillStyle='rgba(0,0,0,.25)';
  const tIdx=(mode==='tornado'&&tor)?Math.floor(tor.t*M.tornado.fps):-1;
  if(!(tIdx>=30&&tIdx<=62)){ctx.beginPath();ctx.ellipse(hero.x,HY+3,52,9,0,0,7);ctx.fill();}
  let alpha=1;
  if(hero.flash>0&&Math.floor(hero.flash*30)%2===0)alpha=.45;
  if(mode==='lose')alpha=.6;
  if(hero.anim==='walk')drawClip('walk',Math.floor(hero.t*M.walk.fps)%M.walk.n,hero.x,HY,alpha);
  else if(hero.anim==='cast'&&hero.cast){const cl=M[hero.cast.clip];drawClip(hero.cast.clip,Math.min(Math.floor(hero.t*cl.fps),cl.n-1),hero.x,HY,alpha);}
  else if(hero.anim==='tornado'&&tor)drawClip('tornado',Math.min(Math.floor(tor.t*M.tornado.fps),M.tornado.n-1),hero.x,HY,alpha);
  else if(hero.anim==='ult'&&ult){
    if(ult.t>.55&&ult.t<.75){const p=(ult.t-.55)/.2;for(let k=5;k>=1;k--){drawClip('ult',5,lerp(ult.from,ult.to,ease(Math.max(0,p-k*.07))),HY,.28);}}
    drawClip('ult',ult.frame,hero.x,HY,alpha);
  }
  else drawClip('idle',Math.floor(hero.t*M.idle.fps)%M.idle.n,hero.x,HY,alpha);
}
function bar(x,y,w,h,p,col,label){
  ctx.fillStyle='#14161a';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#3a4150';ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(p,0,1),h);
  if(label)txt(label,x+8,y+h/2+1,h*.78,'#fff','left');
}
function buttons(){
  if(sel==='sword')return [{id:'atk',x:852,y:448,r:62,label:'TAJO',sz:28},{id:'skill',x:732,y:484,r:44,label:'TORNADO',sz:12},{id:'ult',x:628,y:490,r:42,label:'CORTE',sz:15}];
  if(sel==='ring')return [{id:'atk',x:852,y:448,r:62,label:'DARDO',sz:26},{id:'skill',x:732,y:484,r:44,label:'RUNAS',sz:15},{id:'ult',x:628,y:490,r:42,label:'ANILLO',sz:13}];
  if(sel==='ase')return [{id:'atk',x:852,y:448,r:62,label:'BATAZO',sz:23},{id:'skill',x:732,y:484,r:44,label:'EMBISTE',sz:12},{id:'ult',x:628,y:490,r:42,label:'JONRÓN',sz:13}];
  if(sel==='doc')return [{id:'atk',x:852,y:448,r:62,label:'LÁTIGO',sz:24},{id:'skill',x:732,y:484,r:44,label:'CURAR',sz:15},{id:'ult',x:628,y:490,r:42,label:'JERINGA',sz:12}];
  if(sel==='tank')return [{id:'atk',x:852,y:448,r:62,label:'PELUCHE',sz:21},{id:'skill',x:732,y:484,r:44,label:'ABRAZO',sz:13},{id:'ult',x:628,y:490,r:42,label:'OSO',sz:20}];
  return [{id:'atk',x:852,y:448,r:62,label:'RAYO',sz:28},{id:'skill',x:732,y:484,r:44,label:'FLASH',sz:16},{id:'ult',x:628,y:490,r:42,label:'ULT',sz:20}];
}
function btnOK(b){
  if(b.id==='atk')return idleOK();
  if(b.id==='skill')return idleOK()&&hero.sk<=0;
  return idleOK()&&hero.en>=100;
}
function hud(){
  bar(24,22,260,22,hero.hp/hero.max,'#ff5a5a','HP');
  bar(24,56,260,16,hero.en/100,hero.en>=100?'#ffd35c':'#58b8ff','');
  if(hero.en>=100&&mode==='battle')txt('¡ULTIMATE LISTA!',298,64,18,'#ffd35c','left');
  const left=slimes.filter(s=>s.st==='alive'||s.st==='dying').length;
  txt('Slimes: '+left,W-24,34,24,'#fff','right');
  for(const b of buttons()){
    const ok=btnOK(b),pulse=(b.id==='ult'&&ok)?1+.06*Math.sin(time*8):1;
    ctx.globalAlpha=ok?1:.5;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*pulse,0,7);ctx.fillStyle='rgba(20,22,26,.78)';ctx.fill();
    ctx.lineWidth=b.id==='atk'?6:7;ctx.strokeStyle=b.id==='atk'?'#ffd35c':'#3a4150';
    if(b.id!=='atk'){ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,0,7);ctx.stroke();}
    else{ctx.stroke();}
    if(b.id==='ult'){ctx.strokeStyle=ok?'#fff':'#58b8ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(hero.en/100,0,1));ctx.stroke();}
    if(b.id==='skill'){ctx.strokeStyle=ok?'#ff9fd0':'#8a5a76';ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-clamp(hero.sk/hero.skm,0,1)));ctx.stroke();}
    txt(b.label,b.x,b.y,b.sz,ok?'#fff':'#9aa4b5');
    ctx.globalAlpha=1;
  }
}
const PANELS=['sword','mage','tank','doc','ase','ring'].map((id,i)=>({id,x:16+i*156,y:100,w:148,h:360}));
function drawSelect(){
  bg();
  txt('Elige tu héroe',W/2,62,48,'#ffd35c');
  txt('Cambio '+VERSION,W-18,22,20,'#fff','right');
  const keep=sel;
  for(const p of PANELS){
    ctx.fillStyle='rgba(20,22,26,.78)';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,22);ctx.fill();
    ctx.lineWidth=5;ctx.strokeStyle='#ffd35c';ctx.stroke();
    use(p.id);
    drawClip('idle',Math.floor(time*M.idle.fps)%M.idle.n,p.x+p.w/2,p.y+245);
    txt(HEROES[p.id].name,p.x+p.w/2,p.y+282,21,'#fff');
    HEROES[p.id].moves.split(' · ').forEach((m,k)=>txt(m,p.x+p.w/2,p.y+314+k*17,14,'#ffd35c'));
  }
  use(keep);
  txt('Toca un héroe para empezar',W/2,490,22,'#fff');
}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  if(mode==='select'){drawSelect();return;}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  slimes.slice().sort((a,b)=>b.x-a.x).forEach(drawSlime);
  if(ult&&ult.dark>0){ctx.fillStyle='rgba(6,8,20,'+ult.dark+')';ctx.fillRect(-20,-20,W+40,H+40);}
  if(ult&&ult.streak>0){
    const y=HY-85;ctx.globalAlpha=ult.streak;ctx.lineCap='round';
    ctx.strokeStyle='#14161a';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(ult.from,y);ctx.lineTo(hero.x,y);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.stroke();ctx.globalAlpha=1;
  }
  drawHero();
  for(const f of fx){const p=f.t/.8;ctx.globalAlpha=1-p;ctx.lineWidth=14*(1-p)+3;ctx.strokeStyle='#ff9fd0';ctx.beginPath();ctx.ellipse(f.x+p*420,f.y,30+p*140,20+p*110,0,0,7);ctx.stroke();ctx.globalAlpha=1;}
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.col;ctx.lineWidth=2;ctx.strokeStyle='#14161a';
    if(p.heart){heart(p.x,p.y,p.r);ctx.fill();ctx.stroke();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.stroke();}
  }
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=clamp(f.life*2,0,1);txt(f.text,f.x,f.y,f.size||28,f.color);}
  ctx.globalAlpha=1;
  ctx.restore();
  hud();
  if(mode==='ult'&&ult&&ult.t<1.1)txt('¡CORTE RELÁMPAGO!',W/2,120,46,'#fff');
  if(mode==='intro'&&hero.x>=HX*.5)txt('¡Slimes!',W/2,120,52,'#ffd35c');
  if(mode==='win'||mode==='lose'){
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
    txt(mode==='win'?'¡Victoria!':'Derrota',W/2,210,72,mode==='win'?'#ffd35c':'#ff6b6b');
    if(endT>.5)txt('Toca para elegir héroe',W/2,290,28,'#fff');
  }
}

/* ---------- entrada ---------- */
function startGame(id){use(id);reset();}
function press(x,y){
  if(mode==='select'){
    for(const p of PANELS)if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){startGame(p.id);return;}
    return;
  }
  if((mode==='win'||mode==='lose')&&endT>.5){mode='select';return;}
  for(const b of buttons()){
    if(Math.hypot(x-b.x,y-b.y)<=b.r+14){
      if(b.id==='atk')actAttack();else if(b.id==='skill')actSkill();else actUlt();
      return;
    }
  }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  press((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(mode==='select'){if(e.code==='Digit1')startGame('sword');if(e.code==='Digit2')startGame('mage');if(e.code==='Digit3')startGame('tank');if(e.code==='Digit4')startGame('doc');if(e.code==='Digit5')startGame('ase');if(e.code==='Digit6')startGame('ring');return;}
  if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();if(mode==='win'||mode==='lose'){if(endT>.5)mode='select';}else actAttack();}
  if(e.code==='KeyL')actSkill();
  if(e.code==='KeyK'||e.code==='KeyU')actUlt();
});

/* ---------- bucle ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();requestAnimationFrame(loop);
}
const jobs=[];
for(const id in HEROES)for(const n in MAN[id])if(MAN[id][n].n)jobs.push(loadClip(id,n));
Promise.all(jobs).then(()=>{
  document.getElementById('load').style.display='none';
  use('sword');mode='select';requestAnimationFrame(loop);
});
</script></body></html>
