function edDraw(S,ox,oy){if(ED.dirtyT&&performance.now()-(ED.lastR||0)>150){ED.dirtyT=false;ED.lastR=performance.now();edRefresh(false);}

function edGoto(id){if(id==='dg'){SC='dg';}else{SC='town';TWN.sc=id;const s=TSC[id];TWN.cam=null;ED.camT=null;let ok=false;for(let j=1;j<s.h-1&&!ok;j++)for(let i=1;i<s.w-1&&!ok;i++)if(!s.sol[j*s.w+i]){TWN.x=i+.5;TWN.y=j+.5;ok=true;}}
