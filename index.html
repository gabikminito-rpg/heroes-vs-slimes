<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Exploración isométrica (prueba)</title>
<style>
html,body{margin:0;height:100%;background:#070d0c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:8px;top:max(6px,env(safe-area-inset-top));color:#cfe8d0;font:600 12px system-ui,sans-serif;opacity:.85;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.35}
#zoom{position:fixed;right:8px;top:max(6px,env(safe-area-inset-top));display:flex;gap:6px}
#ab,#db,#ub{position:fixed;border-radius:50%;border:2px solid #7fd8ff;background:#0c2a3acc;color:#bfeaff;font:800 14px system-ui;touch-action:none;z-index:5;user-select:none}
#ab{right:14px;bottom:max(18px,env(safe-area-inset-bottom));width:80px;height:80px;border-color:#ffd37f;color:#ffe9bf;font-size:17px}
#db{right:104px;bottom:max(18px,env(safe-area-inset-bottom));width:60px;height:60px}
#ub{right:30px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 96px);width:64px;height:64px;border-radius:50%;border:2px solid #7fd8ff;background:#0c2a3acc;color:#bfeaff;font:800 16px system-ui;touch-action:manipulation;z-index:5}#ub:disabled{opacity:.45}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid #4c6a52;background:#10201acc;color:#cfe8d0;font:700 20px system-ui;touch-action:manipulation}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cfe8d0;font:600 16px system-ui,sans-serif;text-align:center;padding:20px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<button id="ab">ATK</button><button id="db">DASH</button><button id="ub">ULT</button>
<div id="zoom"><button id="zm">&minus;</button><button id="zp">+</button></div>
<div id="msg">Cargando…</div>
<script>
(()=>{
'use strict';
const VER='iso-prueba v15';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dark=document.createElement('canvas'), dctx=dark.getContext('2d');
const hud=document.getElementById('hud'), msg=document.getElementById('msg');
const names=['grass_a','grass_b','grass_c','grass_d','path_a','cliff_l','cliff_r','block','tree','stump','mush','hero/idleF','hero/walkF','hero/idleB','hero/walkB','hero/atkF','hero/atkB','hero/ultF','hero/ultB','hero/dashF','hero/dashB','hero/atk2F','hero/atk2B','hero/hurtF','hero/hurtB','hero/deadF','hero/deadB'];
const IMG={}; let loaded=0, failed=null;
names.forEach(n=>{const im=new Image();
  im.onload=()=>{if(++loaded===names.length&&!failed){msg.remove();requestAnimationFrame(frame);}};
  im.onerror=()=>{failed=n;msg.textContent='No cargó la imagen: '+n;};
  im.src='assets/iso/'+n+'.png?v=8';IMG[n]=im;});

/* ---------- mapa ---------- */
const HW=55, HH=28, LH=34;          // medio ancho / medio alto de la casilla, alto de un piso
const MW=18, MH=16;
const terrace=(i,j)=>i>=10&&i<=15&&j>=2&&j<=6;
const blocks=[[4,9],[5,9],[4,10]];
const blockSet=new Set(blocks.map(b=>b.join(',')));
const pathSet=new Set(['2,7','3,7','4,7','5,7','5,6','6,6','6,5','7,5','8,5','9,5','9,6','9,7','9,8','8,8','8,9']);
const trees=[[1.5,1.5],[3.5,0.8],[0.8,4.5],[2.6,12.5],[5.4,13.5],[8.5,14.2],[12.4,12.6],[15.5,10.5],[16.6,13.2],
 [16.3,7.5],[1.4,9.5],[7.2,2.0],[8.8,1.4],[5.0,3.0],[13.0,9.5],[11.2,13.8],[0.8,13.2],[9.4,11.2],[6.6,9.8],[3.0,6.2],
 [11.5,3.4],[13.6,3.2],[14.5,5.4],[10.8,5.6],[12.6,4.6]];
const STUMP=[7.5,5.5];
const mushes=[[7.5,9.5],[12.5,10.5],[3.5,4.5],[14.5,13.5]].map((p,k)=>({x:p[0],y:p[1],tx:p[0],ty:p[1],wait:Math.random()*2,face:-1,ph:k*1.7,hp:20,cd:0,flash:0,kx:0,ky:0,alive:true,resp:0}));
const hero={x:6.5,y:7.8,z:0,face:1,walk:0,moving:false,hp:100,cd:0,inv:0,swing:0,dead:0,back:false,atkT:0,ult:0,ultCd:0,ultHit:false,dash:0,dashCd:0,fx:1,fy:0,held:false,combo:false,lastAtk:0,pend:false,hurtT:0};
const bag={esp:0,somb:0};
const R=0.17;
{const q=new URLSearchParams(location.search);if(q.get('x'))hero.x=+q.get('x');if(q.get('y'))hero.y=+q.get('y');}

const cellSolid=(i,j)=>terrace(i,j)||blockSet.has(i+','+j);
function blockedAt(x,y,r){
  if(x<r||y<r||x>MW-r||y>MH-r) return true;
  for(let i=Math.floor(x-r);i<=Math.floor(x+r);i++)for(let j=Math.floor(y-r);j<=Math.floor(y+r);j++){
    if(!cellSolid(i,j))continue;
    const cx=Math.max(i,Math.min(x,i+1)), cy=Math.max(j,Math.min(y,j+1));
    if((x-cx)**2+(y-cy)**2<r*r) return true;
  }
  for(const t of trees){ if(t[0]>=10&&t[0]<16&&t[1]>=2&&t[1]<7)continue; if((x-t[0])**2+(y-t[1])**2<(0.2+r)**2) return true; }
  if((x-STUMP[0])**2+(y-STUMP[1])**2<(0.4+r)**2) return true;
  return false;
}

/* ---------- dibujo ---------- */
const S2=(wx,wy)=>[Math.round((wx-wy)*HW),Math.round((wx+wy)*HH)];
function pixShadow(x,y,rx,ry,a){
  ctx.fillStyle='rgba(0,0,0,'+a+')';
  for(let dy=-ry;dy<=ry;dy++){const h=Math.round(rx*Math.sqrt(1-(dy/(ry+0.5))**2));ctx.fillRect(x-h,y+dy,h*2,1);}
}
function spr(name,wx,wy,z,ax,ay){const [sx,sy]=S2(wx,wy);ctx.drawImage(IMG[name],sx-ax,sy-z-ay);}
const hc=document.createElement('canvas'), hx=hc.getContext('2d'); hc.width=100;hc.height=60;
const GL={};
function glowOf(key){
  if(GL[key])return GL[key];
  const im=IMG['hero/'+key], c=document.createElement('canvas');c.width=im.width;c.height=im.height;
  const x=c.getContext('2d');x.drawImage(im,0,0);let d;try{d=x.getImageData(0,0,c.width,c.height);}catch(e){x.clearRect(0,0,c.width,c.height);return GL[key]=c;}const p=d.data;
  for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];
    if(!(p[i+3]>0&&b>150&&b-r>=45)){p[i+3]=0;}}
  x.putImageData(d,0,0);return GL[key]=c;
}
function drawHero(){
  const [sx,sy0]=S2(hero.x,hero.y); const sy=sy0-Math.round(hero.z);
  const fsx=(STUMP[0]-STUMP[1])-(hero.x-hero.y), fd=Math.hypot(STUMP[0]-hero.x,STUMP[1]-hero.y), fs=Math.sign(fsx)||1, sOff=Math.round(-fs*Math.min(5,2+3*Math.max(0,1-fd/6)));
  pixShadow(sx+sOff,sy,10,4,0.16);pixShadow(sx+sOff,sy,7,3,0.2);
  const B=hero.back?'B':'F', nat=hero.back?1:-1;
  let key,fi;
  if(hero.hp<=0){key='dead'+B;fi=Math.min(29,Math.floor((2.2-hero.dead)/1.0*30));}
  else if(hero.ult>0){key='ult'+B;fi=Math.min(29,Math.floor((1-hero.ult/1.0)*30));}
  else if(hero.dash>0){key='dash'+B;fi=Math.min(23,Math.floor((1-hero.dash/.32)*24));}
  else if(hero.atkT>0){key='atk'+(hero.combo?'2':'')+B;fi=Math.min(14,Math.floor((1-hero.atkT/.5)*15));}
  else if(hero.hurtT>0){key='hurt'+B;fi=Math.min(29,Math.floor((1-hero.hurtT/.5)*30));}
  else if(hero.moving){key='walk'+B;fi=Math.floor(hero.walk*3)%15;}
  else{key='idle'+B;fi=Math.floor(performance.now()/130)%15;}
  ctx.save(); ctx.translate(sx,sy); if(hero.face!==nat)ctx.scale(-1,1);
  if(hero.hp>0&&hero.ult<=0&&hero.dash<=0&&hero.hurtT<=0&&hero.inv>0&&Math.floor(performance.now()/80)%2)ctx.globalAlpha=.4;
  const D_={ultF:[75,72,38,63],ultB:[98,78,56,67],dashF:[100,42,44,40],dashB:[98,50,53,47],hurtF:[64,46,26,42],hurtB:[72,49,47,47],deadF:[79,49,52,42],deadB:[82,54,29,47]}[key]||[92,57,40,48];
  const flip=hero.face!==nat, W_=D_[0], H_=D_[1];
  if(hc.width<W_||hc.height<H_){hc.width=Math.max(hc.width,W_);hc.height=Math.max(hc.height,H_);}
  hx.globalCompositeOperation='source-over';hx.clearRect(0,0,hc.width,hc.height);
  hx.drawImage(IMG['hero/'+key],fi*W_,0,W_,H_,0,0,W_,H_);
  hx.globalCompositeOperation='source-atop';
  // luz cálida de la fogata (con borde del lado del fuego)
  const fa=Math.max(0,1-fd/6.5)*(.9+Math.sin(performance.now()/110)*.1);
  if(fa>0){const side=flip?-fs:fs, g=hx.createLinearGradient(side>0?W_:0,0,side>0?W_*.25:W_*.75,0);
    g.addColorStop(0,'rgba(255,150,60,'+(fa*.42)+')');g.addColorStop(1,'rgba(255,150,60,'+(fa*.10)+')');hx.fillStyle=g;hx.fillRect(0,0,W_,H_);}
  // sombra bajo copas de árboles
  let td=9;for(const t_ of trees){const d_=Math.hypot(t_[0]-hero.x,t_[1]-hero.y);if(d_<td)td=d_;}
  if(td<1.5){hx.fillStyle='rgba(8,18,40,'+((1-td/1.5)*.3)+')';hx.fillRect(0,0,W_,H_);}
  ctx.drawImage(hc,0,0,W_,H_,-D_[2],-D_[3],W_,H_);
  // brillo de la espada / arco (aditivo)
  if(key[0]==='a'&&key[1]==='t'||key.startsWith('ult')||key.startsWith('dash')){
    const gl=glowOf(key); ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.3;
    for(const [ox_,oy_] of [[0,0],[-1,0],[1,0],[0,-1],[0,1],[-2,0],[2,0]])ctx.drawImage(gl,fi*W_,0,W_,H_,-D_[2]+ox_,-D_[3]+oy_,W_,H_);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  ctx.restore();
}
const WH={};
function whiteOf(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return c;}
function drawMush(m){
  const [sx,sy]=S2(m.x,m.y); const b=Math.round(Math.sin(performance.now()/260+m.ph)*1.2);
  pixShadow(sx,sy,9,3,0.3);
  ctx.save(); ctx.translate(sx,sy-b); ctx.scale(m.face,1);
  ctx.drawImage(m.flash>0?(WH.mush||(WH.mush=whiteOf(IMG.mush))):IMG.mush,-18,-37); ctx.restore();
  if(m.hp<20){ctx.fillStyle='#000a';ctx.fillRect(sx-11,sy-b-46,22,4);ctx.fillStyle='#e05040';ctx.fillRect(sx-10,sy-b-45,Math.max(0,Math.round(20*m.hp/20)),2);}
}
function drawDrop(d){
  const [sx,sy]=S2(d.x,d.y); const b=Math.round(Math.sin(performance.now()/300+d.ph)*1.5)+3;
  pixShadow(sx,sy,4,2,.3);
  if(d.type==='somb'){
    ctx.fillStyle='#7a2d1a';ctx.fillRect(sx-4,sy-b-6,8,1);ctx.fillStyle='#b8442a';ctx.fillRect(sx-4,sy-b-5,8,3);
    ctx.fillStyle='#d9694a';ctx.fillRect(sx-3,sy-b-6,6,1);ctx.fillStyle='#ffe8c8';ctx.fillRect(sx-2,sy-b-4,1,1);ctx.fillRect(sx+1,sy-b-3,1,1);
  }else{
    ctx.fillStyle='#d98cff';ctx.fillRect(sx-1,sy-b-7,3,1);ctx.fillRect(sx-2,sy-b-6,5,3);ctx.fillRect(sx-1,sy-b-3,3,1);
    ctx.fillStyle='#fff';ctx.fillRect(sx-1,sy-b-6,1,1);
  }
}
function drawSlash(){
  if(hero.swing<=0)return; const [sx,sy]=S2(hero.x,hero.y); const a=hero.swing/.18;
  ctx.fillStyle='rgba(255,255,255,'+a+')';
  for(let k=0;k<=8;k++){const ang=(-65+k*16)*Math.PI/180;ctx.fillRect(Math.round(sx+hero.face*(6+Math.cos(ang)*20)),Math.round(sy-12+Math.sin(ang)*16),3,3);}
}
function drawFloats(){
  ctx.font='700 9px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=2;ctx.lineJoin='round';
  for(const f of floats){const [sx,sy]=S2(f.x,f.y);const y=sy-44-f.t*22;ctx.globalAlpha=Math.max(0,1-f.t/.9);
    ctx.strokeStyle='#000';ctx.strokeText(f.txt,sx,y);ctx.fillStyle=f.col;ctx.fillText(f.txt,sx,y);}
  ctx.globalAlpha=1;
}
function drawHud(k){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';
  const x=8*k,y=46*k,w=150*k,h=11*k;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-2*k,y-2*k,w+4*k,h+4*k);
  const p=Math.max(0,hero.hp)/100;ctx.fillStyle=p>.5?'#5ccf5c':p>.25?'#e0c040':'#e05040';ctx.fillRect(x,y,w*p,h);
  ctx.fillStyle='#fff';ctx.font='700 '+(10*k)+'px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('HP '+Math.max(0,Math.ceil(hero.hp)),x+4*k,y+.5*k);
  ctx.fillText('Esporas '+bag.esp+'  ·  Sombreros '+bag.somb,x,y+h+6*k);
  if(hero.hp<=0){ctx.textAlign='center';ctx.font='700 '+(18*k)+'px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText('Derrotado… reapareciendo',cv.width/2,cv.height*.42);}
}

/* ---------- lista estática (ordenada por profundidad) ---------- */
const stat=[];
for(let i=0;i<MW;i++)for(let j=0;j<MH;j++){
  const [cx,cy]=S2(i+.5,j+.5);
  if(terrace(i,j)){
    stat.push({k:i+j,f:()=>ctx.drawImage(IMG['grass_'+'abcd'[(i*7+j*13)%4]],cx-HW,cy-LH-HH)});
    if(!terrace(i,j+1)) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_l,cx-HW,cy-LH)});
    if(!terrace(i+1,j)) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_r,cx+HW-59,cy-LH)});
  }else{
    if(j===MH-1) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_l,cx-HW,cy)});
    if(i===MW-1) stat.push({k:i+j+.99,f:()=>ctx.drawImage(IMG.cliff_r,cx+HW-59,cy)});
  }
}
for(const [i,j] of blocks){const [cx,cy]=S2(i+.5,j+.5);stat.push({k:i+j+.6,f:()=>ctx.drawImage(IMG.block,cx-58,cy+HH-104)});}
for(const t of trees){
  const z=(t[0]>=10&&t[0]<16&&t[1]>=2&&t[1]<7)?LH:0;
  stat.push({k:t[0]+t[1],f:()=>{const [sx,sy]=S2(t[0],t[1]);pixShadow(sx,sy-z,15,5,0.28);spr('tree',t[0],t[1],z,35,81);}});
}
stat.push({k:STUMP[0]+STUMP[1],f:()=>{const [sx,sy]=S2(STUMP[0],STUMP[1]);pixShadow(sx,sy,26,8,0.3);spr('stump',STUMP[0],STUMP[1],0,42,74);}});

/* ---------- cámara, entrada, partículas ---------- */
let zoomAdj=0, cam=null;
document.getElementById('zm').onclick=()=>{zoomAdj--;};
document.getElementById('zp').onclick=()=>{zoomAdj++;};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')castUlt();if(e.key==='k')castDash();if(e.key==='j')hero.held=true;});
addEventListener('keyup',e=>{if(e.key==='j')hero.held=false;});
function castUlt(){if(hero.hp<=0||hero.ult>0||hero.ultCd>0)return;hero.ult=1.0;hero.ultCd=6;hero.ultHit=false;hero.pend=false;hero.atkT=0;}
const ub=document.getElementById('ub');ub.onclick=castUlt;
document.getElementById('db').onclick=castDash;
const ab=document.getElementById('ab');
ab.onpointerdown=e=>{e.preventDefault();hero.held=true;};ab.onpointerup=ab.onpointerleave=ab.onpointercancel=()=>{hero.held=false;};
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
let joy=null;
cv.addEventListener('pointerdown',e=>{if(joy)return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY;}});
const endJ=e=>{if(joy&&joy.id===e.pointerId)joy=null;};
cv.addEventListener('pointerup',endJ);cv.addEventListener('pointercancel',endJ);
function inputVec(){
  let ux=0,uy=0;
  if(keys.a||keys.arrowleft)ux-=1; if(keys.d||keys.arrowright)ux+=1;
  if(keys.w||keys.arrowup)uy-=1; if(keys.s||keys.arrowdown)uy+=1;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>10){const m=Math.min(1,(d-10)/50);ux=dx/d*m;uy=dy/d*m;}}
  const l=Math.hypot(ux,uy); if(l>1){ux/=l;uy/=l;}
  return [ux,uy];
}
const embers=[], flies=[], floats=[], drops=[];
function addFloat(x,y,txt,col){floats.push({x,y,txt,col,t:0});}
function hurtHero(n){
  if(hero.inv>0||hero.hp<=0)return;
  hero.hp-=n;hero.inv=.5;hero.hurtT=.5;addShake(2,.1);addFloat(hero.x,hero.y,'-'+n,'#ff6a5a');
  if(hero.hp<=0){hero.hp=0;hero.dead=2.2;hero.atkT=0;hero.pend=false;hero.dash=0;hero.ult=0;}
}
function killMush(m){
  m.alive=false;m.resp=8;
  const n=1+Math.floor(Math.random()*2);
  for(let k=0;k<n;k++)drops.push({x:m.x+(Math.random()-.5)*.5,y:m.y+(Math.random()-.5)*.5,type:Math.random()<.2?'somb':'esp',ph:Math.random()*6});
}
function respawn(m){
  for(let k=0;k<40;k++){
    const x=1+Math.random()*(MW-2),y=1+Math.random()*(MH-2);
    if(cellSolid(Math.floor(x),Math.floor(y))||blockedAt(x,y,.2)||Math.hypot(x-hero.x,y-hero.y)<5)continue;
    m.x=x;m.y=y;m.tx=x;m.ty=y;m.hp=20;m.alive=true;m.kx=m.ky=0;m.cd=0;m.flash=0;return;
  }
  m.resp=2;
}

/* ---------- efectos ---------- */
const parts=[], rings=[]; let hs=0; const shake={t:0,m:0};
function addShake(m,t){shake.m=Math.max(shake.m,m);shake.t=Math.max(shake.t,t);}
function spark(wx,wy,n,z){const [sx,sy]=S2(wx,wy);for(let k=0;k<n;k++){const a=Math.random()*6.28,v=40+Math.random()*60;
  parts.push({x:sx,y:sy-(z||14),vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7-20,g:90,t:0,life:.18+Math.random()*.14,c:Math.random()<.5?'255,255,255':'255,226,120',s:2,add:1});}}
function dust(wx,wy,n,sm){const [sx,sy]=S2(wx,wy);for(let k=0;k<n;k++){parts.push({x:sx+(Math.random()*8-4),y:sy-2,vx:(Math.random()*2-1)*18,vy:-8-Math.random()*14,g:0,t:0,life:.35+Math.random()*.25,c:'205,196,175',s:sm?2:3,add:0});}}
function ring(wx,wy){rings.push({x:wx,y:wy,t:0});
  const [sx,sy]=S2(wx,wy);for(let k=0;k<22;k++){const a=Math.random()*6.28,v=50+Math.random()*80;
  parts.push({x:sx+Math.cos(a)*14,y:sy+Math.sin(a)*7,vx:Math.cos(a)*v*.5,vy:-60-Math.random()*90,g:300,t:0,life:.5+Math.random()*.3,c:Math.random()<.5?'255,220,110':'120,90,60',s:2,add:0});}}
function fxUpdate(dt){
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.t+=dt;if(p.t>p.life){parts.splice(k,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let k=rings.length-1;k>=0;k--){rings[k].t+=dt;if(rings[k].t>.45)rings.splice(k,1);}
  if(shake.t>0){shake.t-=dt;if(shake.t<=0)shake.m=0;}
}
function drawRings(){
  ctx.globalCompositeOperation='lighter';
  for(const r of rings){const p=r.t/.45,rad=2.6*(1-Math.pow(1-p,2.2)),[cx,cy]=S2(r.x,r.y),a=1-p;
    for(let n=0;n<110;n++){const an=n/110*6.283,x=Math.round(cx+Math.cos(an)*rad*77),y=Math.round(cy+Math.sin(an)*rad*39.6);
      ctx.fillStyle='rgba(255,'+(200+Math.round(55*p))+','+(110+Math.round(120*p))+','+a+')';ctx.fillRect(x,y,3,2);}}
  ctx.globalCompositeOperation='source-over';
}
function drawParts(){
  for(const p of parts){const a=1-p.t/p.life;
    ctx.globalCompositeOperation=p.add?'lighter':'source-over';
    ctx.fillStyle='rgba('+p.c+','+(p.add?a:a*.7)+')';const sz=p.add?p.s:Math.round(p.s*(1+p.t/p.life));
    ctx.fillRect(Math.round(p.x),Math.round(p.y),sz,sz);}
  ctx.globalCompositeOperation='source-over';
}
function attack(){
  hero.cd=.55;hero.atkT=.5;hero.pend=true;
  const now=performance.now();hero.combo=(now-hero.lastAtk<1100)?!hero.combo:false;hero.lastAtk=now;
  let best=null,bd=2.2;
  for(const m of mushes){if(!m.alive)continue;const d=Math.hypot(m.x-hero.x,m.y-hero.y);if(d<bd){bd=d;best=m;}}
  if(best){const dx=best.x-hero.x,dy=best.y-hero.y,d=Math.hypot(dx,dy)||1;hero.fx=dx/d;hero.fy=dy/d;hero.face=(dx-dy)>=0?1:-1;hero.back=(dx+dy)<0;}
}
function strike(){
  const c2=hero.combo;let hit=0;
  for(const m of mushes){if(!m.alive)continue;
    const dx=m.x-hero.x,dy=m.y-hero.y,d=Math.hypot(dx,dy)||1;
    if(d<(c2?1.9:1.7)&&(dx/d*hero.fx+dy/d*hero.fy)>(c2?-.1:.15)){
      const dmg=(c2?9:7)+Math.floor(Math.random()*(c2?5:4));
      m.hp-=dmg;m.flash=.1;m.kx=dx/d*(c2?4.2:3.2);m.ky=dy/d*(c2?4.2:3.2);
      addFloat(m.x,m.y,'-'+dmg,'#ffffff');spark(m.x,m.y,c2?12:8);hit++;
      if(m.hp<=0)killMush(m);
    }}
  if(hit){hs=c2?.08:.05;addShake(c2?2:1,.1);}
}
function castDash(){if(hero.hp<=0||hero.ult>0||hero.dash>0||hero.dashCd>0)return;hero.dash=.32;hero.dashCd=1.4;hero.atkT=0;hero.pend=false;dust(hero.x,hero.y,6);
  hero.back=(hero.fx+hero.fy)<0;hero.face=(hero.fx-hero.fy)>=0?1:-1;}
function combat(dt){
  hero.cd=Math.max(0,hero.cd-dt);hero.inv=Math.max(0,hero.inv-dt);hero.swing=Math.max(0,hero.swing-dt);hero.atkT=Math.max(0,hero.atkT-dt);hero.hurtT=Math.max(0,hero.hurtT-dt);hero.ultCd=Math.max(0,hero.ultCd-dt);hero.dashCd=Math.max(0,hero.dashCd-dt);
  if(hero.dash>0){hero.dash=Math.max(0,hero.dash-dt);hero.inv=Math.max(hero.inv,.1);}
  if(hero.ult>0){hero.ult=Math.max(0,hero.ult-dt);hero.inv=Math.max(hero.inv,.1);
    if(!hero.ultHit&&hero.ult<=0.5){hero.ultHit=true;ring(hero.x,hero.y);addShake(4,.3);hs=.1;for(const m of mushes){if(!m.alive)continue;const dx=m.x-hero.x,dy=m.y-hero.y,d=Math.hypot(dx,dy)||1;if(d<2.6){m.hp-=30;m.flash=.15;m.kx=dx/d*5;m.ky=dy/d*5;addFloat(m.x,m.y,'-30','#9fe8ff');if(m.hp<=0)killMush(m);}}}
    return;}
  if(hero.hp<=0){hero.dead-=dt;if(hero.dead<=0){hero.hp=100;hero.x=6.5;hero.y=7.8;hero.inv=1.5;hero.hurtT=0;}return;}
  if(hero.pend&&hero.atkT<=(hero.combo?.30:.35)){hero.pend=false;strike();}
  if(hero.held&&hero.cd<=0&&hero.dash<=0)attack();
  for(let k=drops.length-1;k>=0;k--){
    const d=drops[k];
    if(Math.hypot(hero.x-d.x,hero.y-d.y)<.6){
      if(d.type==='somb'){bag.somb++;addFloat(hero.x,hero.y,'+1 Sombrero','#ffb36a');}
      else{bag.esp++;addFloat(hero.x,hero.y,'+1 Espora','#e2b0ff');}
      drops.splice(k,1);
    }
  }
}
for(let k=0;k<26;k++)flies.push({x:Math.random()*MW,y:Math.random()*MH,ph:Math.random()*6.28,sp:.15+Math.random()*.25,a:Math.random()*6.28});
let emberT=0;

function update(dt,t){
  const [ux0,uy0]=inputVec(), dead=hero.hp<=0||hero.ult>0||hero.dash>0, ux=dead?0:ux0, uy=dead?0:uy0;
  hero.moving=(ux||uy)?true:false;
  if(hero.moving){
    const sp=95; // px de pantalla por segundo
    const wx=(ux/HW+uy/HH)/2*sp*dt, wy=(uy/HH-ux/HW)/2*sp*dt;
    if(!blockedAt(hero.x+wx,hero.y,R))hero.x+=wx;
    if(!blockedAt(hero.x,hero.y+wy,R))hero.y+=wy;
    if(hero.atkT<=0){if(ux)hero.face=ux>0?1:-1;if(uy)hero.back=uy<0;}
    {const a_=(ux/HW+uy/HH)/2,b_=(uy/HH-ux/HW)/2,l_=Math.hypot(a_,b_)||1;hero.fx=a_/l_;hero.fy=b_/l_;}
    hero.walk+=dt*4.2;hero.stepT=(hero.stepT||0)-dt;if(hero.stepT<=0&&hero.atkT<=0){hero.stepT=.17;dust(hero.x,hero.y,1,1);}
  }
  if(hero.dash>0&&(1-hero.dash/.32)>.2&&(1-hero.dash/.32)<.75){if(Math.random()<dt*22)dust(hero.x,hero.y,1);const wx=hero.fx*9.7*dt,wy=hero.fy*9.7*dt;if(!blockedAt(hero.x+wx,hero.y,R))hero.x+=wx;if(!blockedAt(hero.x,hero.y+wy,R))hero.y+=wy;}
  combat(dt);
  for(let k=floats.length-1;k>=0;k--){floats[k].t+=dt;if(floats[k].t>.9)floats.splice(k,1);}
  for(const m of mushes){
    if(!m.alive){m.resp-=dt;if(m.resp<=0)respawn(m);continue;}
    m.flash=Math.max(0,m.flash-dt);m.cd=Math.max(0,m.cd-dt);
    if(Math.abs(m.kx)+Math.abs(m.ky)>.01){
      const nx=m.x+m.kx*dt,ny=m.y+m.ky*dt;if(!blockedAt(nx,ny,.15)){m.x=nx;m.y=ny;}
      const f=Math.max(0,1-dt*6);m.kx*=f;m.ky*=f;
    }
    const hd=Math.hypot(hero.x-m.x,hero.y-m.y);
    let dx,dy,sp;
    if(hd<3.6&&hero.hp>0){
      dx=hero.x-m.x;dy=hero.y-m.y;sp=hd>.55?.95:0;
      if(hd<.6&&m.cd<=0){m.cd=1.1;hurtHero(6);}
    }else{
      m.wait-=dt;
      if(m.wait<=0&&Math.hypot(m.tx-m.x,m.ty-m.y)<0.05){
        const nx=m.x+(Math.random()-.5)*2.4, ny=m.y+(Math.random()-.5)*2.4;
        const ci=Math.floor(nx),cj=Math.floor(ny);
        if(nx>.5&&ny>.5&&nx<MW-.5&&ny<MH-.5&&!cellSolid(ci,cj)&&!blockedAt(nx,ny,.15)){m.tx=nx;m.ty=ny;}
        m.wait=1+Math.random()*2;
      }
      dx=m.tx-m.x;dy=m.ty-m.y;sp=.55;
    }
    const d=Math.hypot(dx,dy);
    if(d>0.03&&sp>0){
      const s=Math.min(d,sp*dt),nx=m.x+dx/d*s,ny=m.y+dy/d*s;
      if(!blockedAt(nx,m.y,.15))m.x=nx;
      if(!blockedAt(m.x,ny,.15))m.y=ny;
      const sx=(dx-dy);if(Math.abs(sx)>.01)m.face=sx>0?1:-1;
    }
  }
  emberT-=dt;
  if(emberT<=0){emberT=.09;const [fx,fy]=S2(STUMP[0],STUMP[1]);embers.push({x:fx+(Math.random()*8-4),y:fy-60,vx:Math.random()*6-3,vy:-(14+Math.random()*14),l:1});}
  for(let k=embers.length-1;k>=0;k--){const e=embers[k];e.x+=e.vx*dt;e.y+=e.vy*dt;e.l-=dt*.9;if(e.l<=0)embers.splice(k,1);}
  for(const f of flies){f.a+=dt*f.sp;f.x+=Math.cos(f.a)*dt*.25;f.y+=Math.sin(f.a*1.3)*dt*.25;f.x=Math.max(0,Math.min(MW,f.x));f.y=Math.max(0,Math.min(MH,f.y));}
}

/* ---------- luz ---------- */
function lighting(S,ox,oy,t){
  const w=cv.width,h=cv.height;
  if(dark.width!==w||dark.height!==h){dark.width=w;dark.height=h;}
  dctx.setTransform(1,0,0,1,0,0);
  dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,w,h);
  dctx.fillStyle='rgba(3,11,18,0.66)';dctx.fillRect(0,0,w,h);
  dctx.globalCompositeOperation='destination-out';
  const L=(wx,wy,zz,r,a)=>{const [sx,sy]=S2(wx,wy);const x=(sx+ox)*S,y=(sy-zz+oy)*S;
    const g=dctx.createRadialGradient(x,y,0,x,y,r*S);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(.6,'rgba(0,0,0,'+(a*.45)+')');g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;dctx.fillRect(x-r*S,y-r*S,r*S*2,r*S*2);};
  L(6.5,6.2,0,260,.62); L(13,4.4,LH,230,.55); L(12.5,11,0,200,.4); L(3.5,11,0,170,.3);
  const fl=1+Math.sin(t*9)*.06+Math.sin(t*23)*.04;
  L(STUMP[0],STUMP[1],50,190*fl,.95);
  L(hero.x,hero.y,hero.z+10,95,.55);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.drawImage(dark,0,0);
  // brillo cálido de la fogata
  ctx.globalCompositeOperation='lighter';
  {const [sx,sy]=S2(STUMP[0],STUMP[1]);const x=(sx+ox)*S,y=(sy-50+oy)*S,r=150*S*fl;
   const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,150,60,.30)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
  // rayos de luz
  for(let k=0;k<3;k++){
    const bx=(w*(.28+k*.26))+Math.sin(t*.25+k*2)*w*.03, wd=w*.09, len=h*1.15;
    const g=ctx.createLinearGradient(bx,0,bx-len*.45,len);g.addColorStop(0,'rgba(255,240,170,.075)');g.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+wd,0);ctx.lineTo(bx+wd-len*.45,len);ctx.lineTo(bx-len*.45,len);ctx.closePath();ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // viñeta
  const vg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
}

/* ---------- bucle ---------- */
let camSp=5, last=performance.now(), fpsT=0, fpsN=0, fps=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  let dtu=dt;if(hs>0){hs-=dt;dtu=0;}
  update(dtu,t);fxUpdate(dt);
  const dpr=window.devicePixelRatio||1, W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const S=Math.max(1,Math.round(W/820)+zoomAdj), vw=W/S, vh=H/S;
  const [hx,hy]=S2(hero.x,hero.y);
  if(!cam)cam={x:hx,y:hy-20};
  if(hero.dash>0)camSp=0;else camSp=Math.min(5,camSp+dt*3);const cs=camSp;if(hero.dash<=0)cam.x+=(hx-cam.x)*Math.min(1,dt*cs);
  if(hero.dash<=0)cam.y+=(hy-20-cam.y)*Math.min(1,dt*cs);
  const shx=shake.t>0?Math.round((Math.random()*2-1)*shake.m):0, shy=shake.t>0?Math.round((Math.random()*2-1)*shake.m):0;
  const ox=Math.round(vw/2-cam.x)+shx, oy=Math.round(vh/2-cam.y)+shy;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#060b0a';ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  ctx.setTransform(S,0,0,S,ox*S,oy*S);
  // suelo
  for(let s=0;s<MW+MH;s++)for(let i=0;i<MW;i++){const j=s-i;if(j<0||j>=MH||terrace(i,j))continue;
    const [cx,cy]=S2(i+.5,j+.5);
    if(pathSet.has(i+','+j))ctx.drawImage(IMG.path_a,cx-58,cy-HH);
    else ctx.drawImage(IMG['grass_'+'abcd'[(i*7+j*13+((i*j)%5))%4]],cx-HW,cy-HH);}
  drawRings();
  // objetos ordenados
  const list=stat.slice();
  list.push({k:hero.x+hero.y,f:drawHero});
  for(const m of mushes)if(m.alive)list.push({k:m.x+m.y,f:()=>drawMush(m)});
  for(const d of drops)list.push({k:d.x+d.y,f:()=>drawDrop(d)});
  list.sort((a,b)=>a.k-b.k);
  for(const o of list)o.f();
  drawParts();drawFloats();
  // brasas
  ctx.globalCompositeOperation='lighter';
  for(const e of embers){ctx.fillStyle='rgba(255,'+(120+Math.round(e.l*90))+',50,'+(e.l*.9)+')';ctx.fillRect(Math.round(e.x),Math.round(e.y),2,2);}
  for(const f of flies){const [sx,sy]=S2(f.x,f.y);const a=.35+.65*Math.max(0,Math.sin(t*2.2+f.ph));
    ctx.fillStyle='rgba(220,255,140,'+a+')';ctx.fillRect(sx,sy-18-(f.ph*3%14),2,2);}
  ctx.globalCompositeOperation='source-over';
  lighting(S,ox,oy,t);
  drawHud(dpr);
  // joystick
  if(joy){ctx.setTransform(1,0,0,1,0,0);const k=dpr;
    ctx.strokeStyle='rgba(220,255,220,.55)';ctx.lineWidth=2*k;ctx.beginPath();ctx.arc(joy.ox*k,joy.oy*k,50*k,0,6.283);ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
    ctx.fillStyle='rgba(220,255,220,.4)';ctx.beginPath();ctx.arc((joy.ox+Math.cos(a)*d)*k,(joy.oy+Math.sin(a)*d)*k,22*k,0,6.283);ctx.fill();}
  fpsN++;fpsT+=dt;if(fpsT>=.5){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;}
  document.getElementById('ub').textContent=hero.ultCd>0?Math.ceil(hero.ultCd):'ULT';document.getElementById('db').textContent=hero.dashCd>0?Math.ceil(hero.dashCd):'DASH';hud.textContent=VER+' · zoom x'+S+' · '+fps+' fps\nArrastra para moverte (WASD) · ATK J · DASH K · ULT espacio';
  hud.style.whiteSpace='pre';
  requestAnimationFrame(frame);
}
})();
